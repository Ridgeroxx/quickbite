<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>QuickBite | Ghanaian Eatery</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(145deg, #fef5e7 0%, #fff1e0 100%);
      padding-bottom: 100px;
    }
    .container { max-width: 700px; margin: 0 auto; padding: 20px; }
    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(10px);
      border-radius: 32px;
      padding: 12px 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.05);
    }
    .logo h1 { font-size: 1.7rem; background: linear-gradient(135deg, #e67e22, #d35400); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .flag { font-size: 1.5rem; }
    /* categories scroll */
    .categories { display: flex; gap: 10px; overflow-x: auto; margin-bottom: 20px; padding-bottom: 4px; }
    .cat-btn {
      background: white; padding: 8px 18px; border-radius: 40px; font-weight: 600;
      white-space: nowrap; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      transition: all 0.2s;
    }
    .cat-btn.active { background: #e67e22; color: white; box-shadow: 0 4px 12px #e67e22; }
    /* menu grid */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .item-card {
      background: white;
      border-radius: 24px;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 8px 16px rgba(0,0,0,0.08);
    }
    .item-card:hover { transform: translateY(-4px); box-shadow: 0 16px 28px rgba(0,0,0,0.12); }
    .item-img {
      background: #ffe6d6;
      text-align: center;
      font-size: 3rem;
      padding: 20px 0;
    }
    .item-details { padding: 16px; }
    .item-name { font-weight: 700; font-size: 1.2rem; margin-bottom: 6px; }
    .item-price { color: #e67e22; font-weight: 800; margin-bottom: 12px; }
    .addons {
      margin: 12px 0;
      font-size: 0.8rem;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .addon-check {
      background: #f8f2ec;
      border-radius: 40px;
      padding: 5px 12px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }
    .addon-check input { margin-right: 4px; }
    .item-total { font-size: 0.9rem; font-weight: bold; margin: 8px 0; text-align: right; }
    .btn-add {
      background: #e67e22; color: white; border: none; width: 100%;
      padding: 12px; border-radius: 40px; font-weight: 700;
      cursor: pointer; transition: 0.2s; margin-top: 8px;
    }
    .btn-add:hover { background: #d35400; }
    /* cart drawer */
    .cart-drawer {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.9); backdrop-filter: blur(12px);
      color: white; border-radius: 32px 32px 0 0;
      padding: 20px;
      transition: transform 0.3s;
      z-index: 1000;
    }
    .cart-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 12px; }
    .cart-items { max-height: 200px; overflow-y: auto; margin-bottom: 12px; }
    .cart-item { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.85rem; }
    .cart-total { border-top: 1px solid rgba(255,255,255,0.3); padding-top: 10px; font-weight: bold; font-size: 1.1rem; }
    .cart-actions { display: flex; gap: 12px; margin-top: 16px; }
    .btn-clear { background: rgba(255,255,255,0.2); border: none; padding: 10px; border-radius: 40px; flex: 1; }
    .btn-checkout { background: #e67e22; border: none; padding: 10px; border-radius: 40px; flex: 2; font-weight: bold; }
    /* history section */
    .history-section {
      margin-top: 30px;
      background: white;
      border-radius: 32px;
      padding: 20px;
    }
    .history-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 12px; }
    .order-history-item {
      border-bottom: 1px solid #eee;
      padding: 12px 0;
      cursor: pointer;
      transition: 0.1s;
    }
    .order-history-item:hover { background: #fff7f0; }
    .toast {
      position: fixed; bottom: 120px; left: 20px; right: 20px;
      background: #2d6a4f; color: white; text-align: center;
      padding: 12px; border-radius: 60px; z-index: 1100;
      animation: fadeOut 3s forwards;
    }
    @keyframes fadeOut { 0% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; visibility: hidden; } }
    .loading { text-align: center; padding: 40px; color: #888; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo"><h1>🍛 QuickBite <span style="font-size:0.9rem;">🇬🇭</span></h1></div>
    <div class="flag">Ghanaian Taste</div>
  </div>
  <div id="categories" class="categories"></div>
  <div id="menuGrid" class="menu-grid"><div class="loading">Loading menu...</div></div>
  <div class="history-section" id="historySection">
    <div class="history-title">🕒 Your Recent Orders</div>
    <div id="orderHistoryList">Loading...</div>
  </div>
</div>

<div class="cart-drawer" id="cartDrawer">
  <div class="cart-header"><span>🛒 Your Cart</span><span id="cartCount">0</span></div>
  <div id="cartList" class="cart-items">Empty</div>
  <div class="cart-total" id="cartTotal">Total: GHS 0.00</div>
  <div class="cart-actions">
    <button class="btn-clear" id="clearCartBtn">Clear</button>
    <button class="btn-checkout" id="checkoutBtn">Proceed to checkout →</button>
  </div>
</div>

<script>
  const API_BASE = "https://quickbite-joi1.onrender.com"; // CHANGE TO YOUR RENDER URL
  let menu = [];
  let cart = JSON.parse(localStorage.getItem('cart') || '[]');
  let activeCategory = 'all';
  let userId = localStorage.getItem('userId') || ('user_' + Math.random().toString(36).substr(2, 10));
  localStorage.setItem('userId', userId);

  // Fetch menu
  async function loadMenu() {
    try {
      const res = await fetch(`${API_BASE}/api/menu`);
      if (!res.ok) throw new Error();
      menu = await res.json();
      renderCategories();
      renderMenu();
    } catch(err) {
      document.getElementById('menuGrid').innerHTML = '<div class="loading">⚠️ Could not load menu. Check backend.</div>';
    }
  }

  function renderCategories() {
    const cats = ['all', ...new Set(menu.map(i => i.category))];
    const container = document.getElementById('categories');
    container.innerHTML = cats.map(c => `<div class="cat-btn ${c === activeCategory ? 'active' : ''}" data-cat="${c}">${c === 'all' ? 'All' : c}</div>`).join('');
    document.querySelectorAll('.cat-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        activeCategory = btn.dataset.cat;
        renderCategories();
        renderMenu();
      });
    });
  }

  function renderMenu() {
    let filtered = activeCategory === 'all' ? menu : menu.filter(i => i.category === activeCategory);
    const grid = document.getElementById('menuGrid');
    grid.innerHTML = filtered.map(item => `
      <div class="item-card" data-id="${item.id}">
        <div class="item-img">${item.emoji || '🍽️'}</div>
        <div class="item-details">
          <div class="item-name">${escapeHtml(item.name)}</div>
          <div class="item-price">GHS ${item.basePrice}</div>
          <div class="addons" id="addons-${item.id}"></div>
          <div class="item-total" id="total-${item.id}">Item total: GHS ${item.basePrice}</div>
          <button class="btn-add" data-id="${item.id}">Add to Cart</button>
        </div>
      </div>
    `).join('');
    // Populate add-ons per item
    menu.forEach(item => {
      const container = document.getElementById(`addons-${item.id}`);
      if (container && item.addons && item.addons.length) {
        container.innerHTML = item.addons.map(addon => `
          <label class="addon-check">
            <input type="checkbox" class="addon-cb" data-item="${item.id}" data-addon='${JSON.stringify(addon)}'>
            ${addon.name} +GHS ${addon.price}
          </label>
        `).join('');
        // attach change events
        document.querySelectorAll(`#addons-${item.id} .addon-cb`).forEach(cb => {
          cb.addEventListener('change', () => updateItemTotal(item.id));
        });
      } else if (container) container.innerHTML = '';
      updateItemTotal(item.id);
      // attach add to cart button
      const addBtn = document.querySelector(`.btn-add[data-id="${item.id}"]`);
      if (addBtn) addBtn.addEventListener('click', () => addToCart(item.id));
    });
  }

  function updateItemTotal(itemId) {
    const item = menu.find(i => i.id === itemId);
    if (!item) return;
    let total = item.basePrice;
    const selected = document.querySelectorAll(`#addons-${itemId} .addon-cb:checked`);
    selected.forEach(cb => {
      const addon = JSON.parse(cb.dataset.addon);
      total += addon.price;
    });
    const totalSpan = document.getElementById(`total-${itemId}`);
    if (totalSpan) totalSpan.innerText = `Item total: GHS ${total}`;
  }

  function addToCart(itemId) {
    const item = menu.find(i => i.id === itemId);
    if (!item) return;
    const selectedAddons = [];
    const checkboxes = document.querySelectorAll(`#addons-${itemId} .addon-cb:checked`);
    checkboxes.forEach(cb => {
      selectedAddons.push(JSON.parse(cb.dataset.addon));
    });
    const itemTotal = item.basePrice + selectedAddons.reduce((s,a)=> s + a.price,0);
    const cartItem = {
      id: item.id,
      name: item.name,
      basePrice: item.basePrice,
      addons: selectedAddons,
      totalPrice: itemTotal,
      qty: 1
    };
    // combine identical items with same addons
    const existingIndex = cart.findIndex(c => c.id === itemId && JSON.stringify(c.addons) === JSON.stringify(selectedAddons));
    if (existingIndex !== -1) cart[existingIndex].qty++;
    else cart.push(cartItem);
    saveCart();
    showToast(`➕ ${item.name} added`);
    // optional: collapse addons? we keep them open
  }

  function saveCart() {
    localStorage.setItem('cart', JSON.stringify(cart));
    renderCart();
  }

  function renderCart() {
    const cartDiv = document.getElementById('cartList');
    const countSpan = document.getElementById('cartCount');
    const totalSpan = document.getElementById('cartTotal');
    if (!cart.length) {
      cartDiv.innerHTML = '<div style="opacity:0.7;">Your cart is empty</div>';
      countSpan.innerText = '0';
      totalSpan.innerText = 'Total: GHS 0.00';
      return;
    }
    let html = '';
    let subtotal = 0;
    cart.forEach(i => {
      subtotal += i.totalPrice * i.qty;
      html += `<div class="cart-item"><span>${i.name} ${i.addons.length ? `(${i.addons.map(a=>a.name).join(', ')})` : ''} x${i.qty}</span><span>GHS ${(i.totalPrice * i.qty).toFixed(2)}</span></div>`;
    });
    cartDiv.innerHTML = html;
    countSpan.innerText = cart.reduce((s,i) => s + i.qty, 0);
    const delivery = 5.00;
    const total = subtotal + delivery;
    totalSpan.innerHTML = `Subtotal: GHS ${subtotal.toFixed(2)}<br>Delivery: GHS ${delivery}<br><strong>Total: GHS ${total.toFixed(2)}</strong>`;
  }

  async function placeOrder(address) {
    const items = cart.map(i => ({
      id: i.id,
      name: i.name,
      basePrice: i.basePrice,
      addons: i.addons,
      qty: i.qty
    }));
    try {
      const res = await fetch(`${API_BASE}/api/orders`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId, items, address })
      });
      const data = await res.json();
      if (res.ok) {
        cart = [];
        saveCart();
        showToast(`Order #${data.orderId} placed!`);
        alert(`✅ Order #${data.orderId} placed!\nTotal: GHS ${data.total}\n\nSend payment to: ${data.momoNumber}\nAfter payment, type /paid ${data.orderId} YOUR_REFERENCE in Telegram bot.\n\nRider contact: ${data.riderContact} (call after payment confirmation)`);
        loadOrderHistory();
      } else {
        alert('Order failed: ' + (data.error || 'unknown'));
      }
    } catch(err) { alert('Network error. Check backend.'); }
  }

  // Order history & reorder
  async function loadOrderHistory() {
    try {
      const res = await fetch(`${API_BASE}/api/orders/${userId}`);
      const orders = await res.json();
      const container = document.getElementById('orderHistoryList');
      if (!orders.length) {
        container.innerHTML = '<div style="color:#888;">No orders yet. Place your first order!</div>';
        return;
      }
      container.innerHTML = orders.map(order => `
        <div class="order-history-item" data-order='${JSON.stringify(order)}'>
          <div><strong>#${order.id}</strong> - ${order.status} - GHS ${order.total}</div>
          <div style="font-size:0.8rem; color:#e67e22;">${new Date(order.createdAt).toLocaleString()}</div>
          <button class="btn-reorder" data-order='${JSON.stringify(order)}' style="background:#e67e22; border:none; color:white; padding:5px 12px; border-radius:20px; margin-top:6px;">Reorder</button>
        </div>
      `).join('');
      // attach reorder click
      document.querySelectorAll('.btn-reorder').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const order = JSON.parse(btn.dataset.order);
          reorder(order);
        });
      });
    } catch(err) { console.error(err); }
  }

  function reorder(order) {
    // rebuild cart from previous order's items
    const newCart = order.items.map(item => ({
      id: item.id,
      name: item.name,
      basePrice: item.basePrice,
      addons: item.addons || [],
      totalPrice: item.totalPrice,
      qty: item.qty || 1
    }));
    cart = newCart;
    saveCart();
    showToast('Order copied to cart. Proceed to checkout.');
  }

  function showToast(msg) {
    let toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerText = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  }

  function escapeHtml(str) {
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  document.getElementById('clearCartBtn').addEventListener('click', () => { cart = []; saveCart(); });
  document.getElementById('checkoutBtn').addEventListener('click', () => {
    if (!cart.length) return alert('Cart empty');
    const address = prompt('Enter delivery address (street, city):');
    if (address) placeOrder(address);
  });

  loadMenu();
  renderCart();
  loadOrderHistory();
</script>
</body>
</html>
