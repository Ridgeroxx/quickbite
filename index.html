<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>QuickBite | Ghanaian Eatery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* =============================================
       RESET & VARIABLES
       ============================================= */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --amber: #C75B12;
      --amber-light: #E8740E;
      --amber-glow: #F4A23C;
      --amber-pale: #FDEBD0;
      --cream: #FDF6ED;
      --cream-dark: #F5EDE0;
      --white: #FFFFFF;
      --clay: #8B5E3C;
      --clay-light: #A67B5B;
      --text: #2C1810;
      --text-mid: #5C4033;
      --text-light: #8C7060;
      --text-muted: #B0A090;
      --border: #EDE5DA;
      --border-light: #F5F0E8;
      --success: #2D8A4E;
      --success-bg: #E8F5E9;
      --info: #1565C0;
      --info-bg: #E3F2FD;
      --danger: #C62828;
      --danger-bg: #FFEBEE;
      --shadow-xs: 0 1px 2px rgba(44,24,16,0.04);
      --shadow-sm: 0 2px 8px rgba(44,24,16,0.06);
      --shadow-md: 0 6px 20px rgba(44,24,16,0.08);
      --shadow-lg: 0 12px 40px rgba(44,24,16,0.12);
      --shadow-card: 0 2px 12px rgba(139,94,60,0.08);
      --radius: 16px;
      --radius-lg: 24px;
      --radius-pill: 100px;
      --font-body: 'Outfit', system-ui, sans-serif;
      --font-display: 'Fraunces', Georgia, serif;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    body {
      font-family: var(--font-body);
      background: var(--cream);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    /* Subtle background texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 0%, rgba(232,116,14,0.06) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 100%, rgba(139,94,60,0.04) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* =============================================
       CONTAINER
       ============================================= */
    .container {
      position: relative;
      z-index: 1;
      max-width: 960px;
      margin: 0 auto;
      padding: 0 16px 100px;
    }

    /* =============================================
       HEADER — glass-morphism
       ============================================= */
    .header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(253,246,237,0.65);
      backdrop-filter: blur(20px) saturate(1.4);
      -webkit-backdrop-filter: blur(20px) saturate(1.4);
      border-radius: 0 0 var(--radius-lg) var(--radius-lg);
      padding: 12px 20px;
      margin-bottom: 24px;
      border-bottom: 1px solid rgba(237,229,218,0.6);
      transition: all 0.3s var(--ease-out);
    }

    .header.scrolled {
      background: rgba(253,246,237,0.92);
      backdrop-filter: blur(24px) saturate(1.6);
      -webkit-backdrop-filter: blur(24px) saturate(1.6);
      box-shadow: 0 4px 20px rgba(44,24,16,0.06);
    }

    .logo h1 {
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--amber);
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .logo h1 span {
      font-size: 0.65rem !important;
      vertical-align: middle;
    }

    .right-icons {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .greeting {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-mid);
      background: var(--white);
      padding: 7px 14px;
      border-radius: var(--radius-pill);
      box-shadow: var(--shadow-xs);
      border: 1px solid var(--border-light);
      white-space: nowrap;
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Icon buttons (bell + cart) */
    .notification-bell,
    .cart-icon {
      position: relative;
      cursor: pointer;
      background: var(--white);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-light);
      font-size: 1.1rem;
      transition: transform 0.2s var(--ease-spring), box-shadow 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .notification-bell:active,
    .cart-icon:active {
      transform: scale(0.92);
    }

    .notification-badge {
      position: absolute;
      top: -3px;
      right: -3px;
      background: var(--danger);
      color: var(--white);
      font-size: 9px;
      font-weight: 700;
      min-width: 18px;
      height: 18px;
      border-radius: var(--radius-pill);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
      border: 2px solid var(--cream);
      animation: badgePop 0.3s var(--ease-spring);
    }

    .cart-count {
      position: absolute;
      top: -4px;
      right: -4px;
      background: var(--amber);
      color: var(--white);
      font-size: 10px;
      font-weight: 700;
      min-width: 20px;
      height: 20px;
      border-radius: var(--radius-pill);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
      border: 2px solid var(--cream);
    }

    @keyframes badgePop {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }

    /* =============================================
       NOTIFICATION PANEL
       ============================================= */
    .notification-panel {
      position: fixed;
      top: 72px;
      right: 16px;
      width: 300px;
      max-height: 420px;
      background: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      z-index: 2001;
      display: none;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--border);
      animation: panelSlideIn 0.3s var(--ease-out);
    }

    .notification-panel.open { display: flex; }

    @keyframes panelSlideIn {
      from { opacity: 0; transform: translateY(-8px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .notification-header {
      padding: 14px 18px;
      background: linear-gradient(135deg, var(--amber), var(--amber-light));
      color: var(--white);
      font-weight: 600;
      font-size: 0.9rem;
      letter-spacing: 0.02em;
    }

    .notification-list {
      max-height: 360px;
      overflow-y: auto;
      padding: 6px;
      font-size: 0.82rem;
      color: var(--text-mid);
    }

    .notification-item {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-light);
      border-radius: var(--radius);
      margin-bottom: 2px;
      transition: background 0.2s;
      font-size: 0.8rem;
      line-height: 1.5;
    }

    .notification-item:last-child { border-bottom: none; }

    /* =============================================
       CATEGORIES
       ============================================= */
    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 20px;
      padding: 4px 0;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .categories::-webkit-scrollbar { display: none; }

    .cat-btn {
      background: var(--white);
      padding: 9px 20px;
      border-radius: var(--radius-pill);
      font-weight: 600;
      font-size: 0.82rem;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: var(--shadow-xs);
      border: 1.5px solid var(--border);
      color: var(--text-mid);
      transition: all 0.25s var(--ease-out);
      -webkit-tap-highlight-color: transparent;
      text-transform: capitalize;
    }

    .cat-btn:hover {
      border-color: var(--amber-glow);
      color: var(--amber);
    }

    .cat-btn.active {
      background: linear-gradient(135deg, var(--amber), var(--amber-light));
      color: var(--white);
      border-color: transparent;
      box-shadow: 0 3px 12px rgba(199,91,18,0.25);
    }

    /* =============================================
       MENU GRID
       ============================================= */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    @media (min-width: 600px) { .menu-grid { grid-template-columns: repeat(3, 1fr); gap: 18px; } }
    @media (min-width: 900px) { .menu-grid { grid-template-columns: repeat(4, 1fr); gap: 20px; } }

    /* Loading state */
    .loading {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* =============================================
       ITEM CARD
       ============================================= */
    .item-card {
      background: var(--white);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-light);
      transition: transform 0.25s var(--ease-out), box-shadow 0.25s;
      animation: cardFadeIn 0.4s var(--ease-out) both;
    }

    .item-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }

    .item-card:active {
      transform: translateY(-1px);
    }

    @keyframes cardFadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* stagger card animations */
    .item-card:nth-child(1) { animation-delay: 0.02s; }
    .item-card:nth-child(2) { animation-delay: 0.06s; }
    .item-card:nth-child(3) { animation-delay: 0.10s; }
    .item-card:nth-child(4) { animation-delay: 0.14s; }
    .item-card:nth-child(5) { animation-delay: 0.18s; }
    .item-card:nth-child(6) { animation-delay: 0.22s; }
    .item-card:nth-child(7) { animation-delay: 0.26s; }
    .item-card:nth-child(8) { animation-delay: 0.30s; }

    .item-img {
      background: linear-gradient(145deg, var(--amber-pale), #FFF0E0);
      text-align: center;
      font-size: 2.8rem;
      padding: 20px 0 16px;
      position: relative;
      overflow: hidden;
    }

    /* Decorative circle behind emoji */
    .item-img::after {
      content: '';
      position: absolute;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(255,255,255,0.5);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
    }

    .item-details {
      padding: 12px 14px 14px;
    }

    .item-name {
      font-weight: 700;
      font-size: 0.88rem;
      color: var(--text);
      line-height: 1.3;
      margin-bottom: 2px;
    }

    .item-price {
      color: var(--amber);
      font-weight: 800;
      font-size: 0.95rem;
      margin-bottom: 6px;
      font-family: var(--font-display);
    }

    .addons {
      margin: 6px 0;
      font-size: 0.72rem;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .addon-check {
      background: var(--cream-dark);
      border-radius: var(--radius-pill);
      padding: 4px 10px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      font-size: 0.68rem;
      color: var(--text-mid);
      transition: background 0.2s, color 0.2s;
      border: 1px solid transparent;
      -webkit-tap-highlight-color: transparent;
    }

    .addon-check:has(input:checked) {
      background: var(--amber-pale);
      border-color: var(--amber-glow);
      color: var(--amber);
    }

    .addon-check input[type="checkbox"] {
      width: 12px;
      height: 12px;
      accent-color: var(--amber);
    }

    .item-total {
      font-size: 0.72rem;
      font-weight: 600;
      margin: 6px 0;
      text-align: right;
      color: var(--text-light);
    }

    .btn-add {
      background: linear-gradient(135deg, var(--amber), var(--amber-light));
      color: var(--white);
      border: none;
      width: 100%;
      padding: 10px;
      border-radius: var(--radius-pill);
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
      margin-top: 6px;
      transition: transform 0.15s var(--ease-spring), box-shadow 0.2s;
      -webkit-tap-highlight-color: transparent;
      letter-spacing: 0.01em;
    }

    .btn-add:hover {
      box-shadow: 0 4px 16px rgba(199,91,18,0.3);
    }

    .btn-add:active {
      transform: scale(0.96);
    }

    /* =============================================
       CART OVERLAY & DRAWER
       ============================================= */
    .cart-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(44,24,16,0.45);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 1000;
      visibility: hidden;
      opacity: 0;
      transition: all 0.35s var(--ease-out);
    }

    .cart-overlay.open {
      visibility: visible;
      opacity: 1;
    }

    .cart-drawer {
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: 88%;
      max-width: 380px;
      background: var(--white);
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.4s var(--ease-out);
      z-index: 1001;
      border-radius: var(--radius-lg) 0 0 var(--radius-lg);
      box-shadow: -8px 0 40px rgba(44,24,16,0.15);
    }

    .cart-overlay.open .cart-drawer {
      transform: translateX(0);
    }

    .cart-header {
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 1.15rem;
      font-family: var(--font-display);
      color: var(--text);
    }

    .cart-header button {
      background: var(--cream-dark);
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-mid);
      transition: background 0.2s;
    }

    .cart-header button:hover {
      background: var(--border);
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
    }

    .empty-cart {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-light);
    }

    .cart-item:last-child {
      border-bottom: none;
      margin-bottom: 0;
    }

    .cart-item-info { flex: 1; min-width: 0; }

    .cart-item-name {
      font-weight: 600;
      font-size: 0.88rem;
      color: var(--text);
      line-height: 1.3;
      word-break: break-word;
    }

    .cart-item-addons {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .cart-item-qty {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0 12px;
      flex-shrink: 0;
    }

    .cart-item-qty button {
      background: var(--cream-dark);
      border: 1px solid var(--border);
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-mid);
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .cart-item-qty button:hover {
      background: var(--amber-pale);
      border-color: var(--amber-glow);
      color: var(--amber);
    }

    .cart-item-qty button:active {
      transform: scale(0.9);
    }

    .cart-item-qty span {
      font-weight: 700;
      font-size: 0.9rem;
      min-width: 20px;
      text-align: center;
    }

    .cart-item-price {
      font-weight: 700;
      font-size: 0.88rem;
      min-width: 70px;
      text-align: right;
      color: var(--text);
      flex-shrink: 0;
    }

    .cart-footer {
      padding: 16px 20px 20px;
      border-top: 1px solid var(--border);
      background: var(--cream);
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      margin-bottom: 14px;
      font-size: 0.9rem;
      color: var(--text);
    }

    .cart-total span:last-child {
      text-align: right;
      font-size: 0.82rem;
      line-height: 1.5;
    }

    .cart-actions {
      display: flex;
      gap: 10px;
    }

    .btn-checkout,
    .btn-clear {
      flex: 1;
      padding: 13px;
      border-radius: var(--radius-pill);
      border: none;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.2s var(--ease-out);
      -webkit-tap-highlight-color: transparent;
    }

    .btn-checkout {
      background: linear-gradient(135deg, var(--amber), var(--amber-light));
      color: var(--white);
      box-shadow: 0 4px 16px rgba(199,91,18,0.2);
    }

    .btn-checkout:hover {
      box-shadow: 0 6px 20px rgba(199,91,18,0.3);
    }

    .btn-checkout:active { transform: scale(0.97); }

    .btn-clear {
      background: var(--cream-dark);
      color: var(--text-mid);
      border: 1px solid var(--border);
    }

    .btn-clear:hover {
      background: var(--border);
    }

    /* =============================================
       TOAST
       ============================================= */
    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: var(--text);
      color: var(--white);
      font-size: 0.82rem;
      font-weight: 500;
      padding: 10px 22px;
      border-radius: var(--radius-pill);
      z-index: 1100;
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s var(--ease-out);
      box-shadow: var(--shadow-lg);
      max-width: 90%;
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* =============================================
       ORDER HISTORY
       ============================================= */
    .history-section {
      margin-top: 36px;
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-light);
    }

    .history-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 14px;
      color: var(--text);
    }

    .order-history-item {
      border-bottom: 1px solid var(--border-light);
      padding: 14px 0;
      animation: cardFadeIn 0.3s var(--ease-out) both;
    }

    .order-history-item:last-child { border-bottom: none; }

    .order-history-item > div:first-child {
      font-weight: 600;
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .order-history-item > div:first-child strong {
      color: var(--amber);
      font-family: var(--font-display);
    }

    .order-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .btn-reorder,
    .btn-view-details,
    .btn-track {
      border: none;
      color: var(--white);
      padding: 7px 14px;
      border-radius: var(--radius-pill);
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s;
      -webkit-tap-highlight-color: transparent;
      letter-spacing: 0.01em;
    }

    .btn-reorder { background: linear-gradient(135deg, var(--amber), var(--amber-light)); }
    .btn-view-details { background: linear-gradient(135deg, #2980b9, #3498db); }
    .btn-track { background: linear-gradient(135deg, #1e7a41, #2D8A4E); }

    .btn-reorder:active,
    .btn-view-details:active,
    .btn-track:active {
      transform: scale(0.95);
    }

    /* =============================================
       MODALS
       ============================================= */
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(44,24,16,0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
      animation: modalFadeIn 0.3s var(--ease-out);
    }

    @keyframes modalFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: 28px 24px;
      width: 100%;
      max-width: 500px;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
      animation: modalSlideUp 0.35s var(--ease-out);
      line-height: 1.7;
      font-size: 0.9rem;
    }

    @keyframes modalSlideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-content h3 {
      font-family: var(--font-display);
      font-size: 1.2rem;
      margin-bottom: 12px;
      color: var(--text);
    }

    .modal-content p {
      margin-bottom: 6px;
      color: var(--text-mid);
    }

    .modal-content strong {
      color: var(--text);
    }

    .modal-content hr {
      border: none;
      border-top: 1px solid var(--border-light);
      margin: 14px 0;
    }

    .modal-content ul {
      padding-left: 18px;
      margin: 8px 0;
    }

    .modal-content li {
      margin-bottom: 4px;
      font-size: 0.85rem;
    }

    .modal-close {
      float: right;
      background: var(--cream-dark);
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-mid);
      transition: background 0.2s;
      line-height: 1;
    }

    .modal-close:hover { background: var(--border); }

    /* Payment field inside order details modal */
    .payment-field {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .payment-field p {
      font-size: 0.85rem;
      margin-bottom: 8px;
    }

    .payment-field input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: var(--radius-pill);
      margin: 8px 0;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.2s;
      font-family: var(--font-body);
      background: var(--cream);
    }

    .payment-field input:focus {
      border-color: var(--amber);
      background: var(--white);
    }

    .payment-field button {
      background: linear-gradient(135deg, var(--amber), var(--amber-light));
      color: var(--white);
      border: none;
      padding: 12px;
      border-radius: var(--radius-pill);
      width: 100%;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s;
      margin-top: 4px;
    }

    .payment-field button:hover {
      box-shadow: 0 4px 16px rgba(199,91,18,0.25);
    }

    .payment-field button:active {
      transform: scale(0.97);
    }

    .payment-field button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* =============================================
       SCROLLBAR STYLING
       ============================================= */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* =============================================
       RESPONSIVE FINE-TUNING
       ============================================= */
    @media (max-width: 400px) {
      .greeting { display: none; }
      .header { padding: 10px 14px; }
      .logo h1 { font-size: 1.25rem; }
      .menu-grid { gap: 10px; }
      .item-img { font-size: 2.4rem; padding: 14px 0 12px; }
      .item-details { padding: 10px 12px 12px; }
      .item-name { font-size: 0.82rem; }
      .item-price { font-size: 0.88rem; }
      .btn-add { padding: 9px; font-size: 0.78rem; }
    }

    @media (min-width: 768px) {
      .container { padding: 0 24px 100px; }
      .header { border-radius: var(--radius-lg); margin-top: 12px; }
      .history-section { padding: 24px 28px; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header" id="pageHeader">
    <div class="logo"><h1>🍛 QuickBite <span style="font-size:0.7rem;">🇬🇭</span></h1></div>
    <div class="right-icons">
      <div class="greeting" id="greeting">Loading...</div>
      <div class="notification-bell" id="notificationBell">
        🔔
        <span class="notification-badge" id="notificationBadge" style="display: none;">0</span>
      </div>
      <div class="cart-icon" id="cartIcon">🛒<span class="cart-count" id="cartCount">0</span></div>
    </div>
  </div>

  <div id="notificationPanel" class="notification-panel">
    <div class="notification-header">Notifications</div>
    <div id="notificationList" class="notification-list">No new notifications</div>
  </div>

  <div id="categories" class="categories"></div>
  <div id="menuGrid" class="menu-grid"><div class="loading">Loading menu...</div></div>
  <div class="history-section">
    <div class="history-title">🕒 Your Recent Orders</div>
    <div id="orderHistoryList">Loading...</div>
  </div>
</div>

<div id="cartOverlay" class="cart-overlay">
  <div class="cart-drawer">
    <div class="cart-header"><span>🛒 Your Cart</span><button id="closeCartBtn" style="background:none; border:none; font-size:1.2rem; cursor:pointer;">✕</button></div>
    <div id="cartDrawerItems" class="cart-items">Empty</div>
    <div class="cart-footer">
      <div class="cart-total"><span>Total</span><span id="cartDrawerTotal">GHS 0.00</span></div>
      <div class="cart-actions">
        <button id="clearCartDrawerBtn" class="btn-clear">Clear</button>
        <button id="checkoutDrawerBtn" class="btn-checkout">Checkout →</button>
      </div>
    </div>
  </div>
</div>

<div id="orderDetailsModal" class="modal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeOrderDetailsModal()">&times;</button>
    <div id="orderDetailsContent"></div>
  </div>
</div>
<div id="trackModal" class="modal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeTrackModal()">&times;</button>
    <h3>🚴 Rider Status</h3>
    <p id="trackRiderName"></p>
    <p id="trackRiderPhone"></p>
    <p id="trackOrderStatus"></p>
  </div>
</div>

<script>
  // ---------- Safe Telegram WebApp initialization ----------
  let tg = null;
  let user = null;
  try {
    if (window.Telegram && window.Telegram.WebApp) {
      tg = window.Telegram.WebApp;
      tg.expand();               // expand to full height
      user = tg.initDataUnsafe?.user;
    }
  } catch(e) {
    console.log("Telegram WebApp not available (running in browser)");
  }

  let userId = user?.id ? String(user.id) : localStorage.getItem('userId');
  let userName = user?.first_name ? user.first_name : (localStorage.getItem('userName') || 'Customer');
  if (!userId) {
    userId = 'user_' + Math.random().toString(36).substr(2, 10);
    localStorage.setItem('userId', userId);
  }
  if (!localStorage.getItem('userName') && user?.first_name) {
    localStorage.setItem('userName', user.first_name);
  }
  document.getElementById('greeting').innerText = `👋 Hello, ${userName}`;

  const API_BASE = 'https://quickbite-joi1.onrender.com';
  let menu = [], cart = JSON.parse(localStorage.getItem('cart') || '[]'), activeCategory = 'all';
  let isCheckingOut = false, lastOrdersState = [], pollInterval = null;
  let notifications = JSON.parse(localStorage.getItem('notifications') || '[]');
  let unreadCount = notifications.filter(n => !n.read).length;

  function getStatusText(status) {
    const map = {
      'pending_payment': 'Awaiting Payment',
      'paid': 'Payment Received',
      'confirmed': 'Order Confirmed',
      'processing': 'Preparing',
      'completed': 'Ready for Delivery',
      'assigned_to_rider': 'Order on its way 🚴',
      'delivered': 'Delivered 🎉'
    };
    return map[status] || status.replace(/_/g, ' ');
  }

  function playBeep() {
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      oscillator.frequency.value = 800;
      gainNode.gain.value = 0.2;
      oscillator.start();
      gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.5);
      oscillator.stop(audioCtx.currentTime + 0.5);
    } catch(e) { console.log('Beep not supported'); }
  }

  function addNotification(message) {
    const newNotif = { id: Date.now(), message, timestamp: new Date().toLocaleTimeString(), read: false };
    notifications.unshift(newNotif);
    if (notifications.length > 50) notifications.pop();
    localStorage.setItem('notifications', JSON.stringify(notifications));
    unreadCount = notifications.filter(n => !n.read).length;
    updateNotificationUI();
    playBeep();
    showToast(message);
  }

  function updateNotificationUI() {
    const badge = document.getElementById('notificationBadge');
    if (unreadCount > 0) {
      badge.style.display = 'flex';
      badge.innerText = unreadCount > 9 ? '9+' : unreadCount;
    } else {
      badge.style.display = 'none';
    }
    const listDiv = document.getElementById('notificationList');
    if (notifications.length === 0) {
      listDiv.innerHTML = 'No notifications';
    } else {
      listDiv.innerHTML = notifications.map(n => `
        <div class="notification-item" data-id="${n.id}" style="opacity: ${n.read ? 0.6 : 1}; background: ${n.read ? '#f9f9f9' : '#fff3e0'};">
          <div>${n.message}</div>
          <div style="font-size: 10px; color: #888;">${n.timestamp}</div>
        </div>
      `).join('');
    }
  }

  function markAllAsRead() {
    notifications.forEach(n => n.read = true);
    unreadCount = 0;
    localStorage.setItem('notifications', JSON.stringify(notifications));
    updateNotificationUI();
  }

  const bell = document.getElementById('notificationBell');
  const panel = document.getElementById('notificationPanel');
  bell.addEventListener('click', (e) => {
    e.stopPropagation();
    if (panel.classList.contains('open')) {
      panel.classList.remove('open');
    } else {
      markAllAsRead();
      updateNotificationUI();
      panel.classList.add('open');
    }
  });
  document.addEventListener('click', (e) => {
    if (!panel.contains(e.target) && e.target !== bell) {
      panel.classList.remove('open');
    }
  });

  function showToast(msg) {
    let toast = document.querySelector('.toast');
    if (!toast) { toast = document.createElement('div'); toast.className = 'toast'; document.body.appendChild(toast); }
    toast.innerText = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  const header = document.getElementById('pageHeader');
  window.addEventListener('scroll', () => header.classList.toggle('scrolled', window.scrollY > 20));

  function saveCart() { localStorage.setItem('cart', JSON.stringify(cart)); updateCartUI(); renderCartDrawer(); }
  function updateCartUI() { document.getElementById('cartCount').innerText = cart.reduce((s,i) => s + i.qty, 0); }

  async function loadMenu() {
    try {
      const res = await fetch(`${API_BASE}/api/menu`);
      if (!res.ok) throw new Error();
      menu = await res.json();
      renderCategories(); renderMenu();
    } catch(err) { document.getElementById('menuGrid').innerHTML = '<div style="text-align:center; padding:40px;">⚠️ Could not load menu</div>'; }
  }

  function renderCategories() {
    const cats = ['all', ...new Set(menu.map(i => i.category))];
    const container = document.getElementById('categories');
    container.innerHTML = cats.map(c => `<div class="cat-btn ${c === activeCategory ? 'active' : ''}" data-cat="${c}">${c === 'all' ? 'All' : c}</div>`).join('');
    document.querySelectorAll('.cat-btn').forEach(btn => btn.addEventListener('click', () => {
      activeCategory = btn.dataset.cat;
      renderCategories(); renderMenu();
    }));
  }

  function renderMenu() {
    let filtered = activeCategory === 'all' ? menu : menu.filter(i => i.category === activeCategory);
    const grid = document.getElementById('menuGrid');
    grid.innerHTML = filtered.map(item => `
      <div class="item-card">
        <div class="item-img">${item.emoji || '🍽️'}</div>
        <div class="item-details">
          <div class="item-name">${escapeHtml(item.name)}</div>
          <div class="item-price">GHS ${item.basePrice}</div>
          <div class="addons" id="addons-${item.id}"></div>
          <div class="item-total" id="total-${item.id}">Item total: GHS ${item.basePrice}</div>
          <button class="btn-add" data-id="${item.id}">Add to Cart</button>
        </div>
      </div>
    `).join('');
    menu.forEach(item => {
      const container = document.getElementById(`addons-${item.id}`);
      if (container && item.addons?.length) {
        container.innerHTML = item.addons.map(addon => `<label class="addon-check"><input type="checkbox" class="addon-cb" data-item="${item.id}" data-addon='${JSON.stringify(addon)}'> ${addon.name} +GHS ${addon.price}</label>`).join('');
        document.querySelectorAll(`#addons-${item.id} .addon-cb`).forEach(cb => cb.addEventListener('change', () => updateItemTotal(item.id)));
      }
      updateItemTotal(item.id);
      const btn = document.querySelector(`.btn-add[data-id="${item.id}"]`);
      if (btn) btn.addEventListener('click', () => addToCart(item.id));
    });
  }

  function updateItemTotal(itemId) {
    const item = menu.find(i => i.id === itemId);
    if (!item) return;
    let total = item.basePrice;
    document.querySelectorAll(`#addons-${itemId} .addon-cb:checked`).forEach(cb => total += JSON.parse(cb.dataset.addon).price);
    const span = document.getElementById(`total-${itemId}`);
    if (span) span.innerText = `Item total: GHS ${total}`;
  }

  function addToCart(itemId) {
    const item = menu.find(i => i.id === itemId);
    if (!item) return;
    const selectedAddons = [];
    document.querySelectorAll(`#addons-${itemId} .addon-cb:checked`).forEach(cb => selectedAddons.push(JSON.parse(cb.dataset.addon)));
    const itemTotal = item.basePrice + selectedAddons.reduce((s,a) => s + a.price, 0);
    const cartItem = { id: item.id, name: item.name, basePrice: item.basePrice, addons: selectedAddons, totalPrice: itemTotal, qty: 1 };
    const existing = cart.find(c => c.id === itemId && JSON.stringify(c.addons) === JSON.stringify(selectedAddons));
    if (existing) existing.qty++;
    else cart.push(cartItem);
    saveCart();
    showToast(`➕ ${item.name} added`);
  }

  function renderCartDrawer() {
    const container = document.getElementById('cartDrawerItems');
    const totalSpan = document.getElementById('cartDrawerTotal');
    if (!cart.length) {
      container.innerHTML = '<div class="empty-cart">Your cart is empty</div>';
      totalSpan.innerHTML = 'GHS 0.00';
      return;
    }
    let html = '', subtotal = 0;
    cart.forEach((item, idx) => {
      const addonText = item.addons.length ? ` (${item.addons.map(a=>a.name).join(', ')})` : '';
      const lineTotal = item.totalPrice * item.qty;
      subtotal += lineTotal;
      html += `<div class="cart-item" data-idx="${idx}">
        <div class="cart-item-info"><div class="cart-item-name">${escapeHtml(item.name)}${addonText}</div><div class="cart-item-addons">GHS ${item.totalPrice} each</div></div>
        <div class="cart-item-qty"><button onclick="changeQty(${idx}, -1)">-</button><span>${item.qty}</span><button onclick="changeQty(${idx}, 1)">+</button></div>
        <div class="cart-item-price">GHS ${lineTotal.toFixed(2)}</div>
      </div>`;
    });
    const total = subtotal + 5.00;
    container.innerHTML = html;
    totalSpan.innerHTML = `Subtotal: GHS ${subtotal.toFixed(2)}<br>+ Delivery: GHS 5.00<br><strong>Total: GHS ${total.toFixed(2)}</strong>`;
  }

  window.changeQty = (idx, delta) => {
    const newQty = cart[idx].qty + delta;
    if (newQty <= 0) cart.splice(idx, 1);
    else cart[idx].qty = newQty;
    saveCart();
  };

  async function placeOrder(customerName, customerPhone, address) {
    if (isCheckingOut) return;
    isCheckingOut = true;
    const btn = document.getElementById('checkoutDrawerBtn');
    btn.disabled = true; btn.innerText = 'Placing order...';
    const items = cart.map(i => ({ id: i.id, name: i.name, basePrice: i.basePrice, addons: i.addons, qty: i.qty }));
    try {
      const res = await fetch(`${API_BASE}/api/orders`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId, items, address, customerName, customerPhone })
      });
      const data = await res.json();
      if (res.ok) {
        cart = []; saveCart(); closeCart();
        showToast(`✅ Order #${data.orderId} placed!`);
        alert(`✅ Order #${data.orderId}\nTotal: GHS ${data.total}\nSend payment to: ${data.momoNumber}\nAfter payment, enter the reference in the order details.\nRider contact: ${data.riderContact}`);
        await loadOrderHistory();
      } else {
        alert('Order failed: ' + (data.error || 'Unknown error'));
      }
    } catch (err) {
      console.error(err);
      alert('Network error. Please try again.');
    } finally {
      isCheckingOut = false;
      btn.disabled = false;
      btn.innerText = 'Checkout →';
    }
  }

  async function submitPaymentReference(orderId, reference) {
    const btn = document.querySelector('#orderDetailsModal .payment-field button');
    if (btn) { btn.disabled = true; btn.innerText = 'Submitting...'; }
    try {
      const res = await fetch(`${API_BASE}/api/orders/${orderId}/payment-reference`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ reference })
      });
      const data = await res.json();
      if (res.ok) {
        showToast('✅ Payment reference submitted! Awaiting admin confirmation.');
        await loadOrderHistory();
        setTimeout(() => closeOrderDetailsModal(), 1500);
      } else {
        alert('Error: ' + data.error);
      }
    } catch (err) {
      alert('Network error. Please try again.');
    } finally {
      if (btn) { btn.disabled = false; btn.innerText = 'Submit Reference'; }
    }
  }

  async function loadOrderHistory() {
    try {
      const res = await fetch(`${API_BASE}/api/orders/${userId}`);
      const orders = await res.json();
      const container = document.getElementById('orderHistoryList');
      if (!orders.length) { container.innerHTML = '<div>No orders yet.</div>'; return; }
      if (lastOrdersState.length > 0) {
        orders.forEach(newOrder => {
          const oldOrder = lastOrdersState.find(o => o.id === newOrder.id);
          if (oldOrder && oldOrder.status !== newOrder.status) {
            let statusMsg = '';
            switch (newOrder.status) {
              case 'confirmed': statusMsg = `Order #${newOrder.id} payment confirmed! We are preparing your meal.`; break;
              case 'processing': statusMsg = `Order #${newOrder.id} is now being prepared.`; break;
              case 'completed': statusMsg = `Order #${newOrder.id} is ready for delivery.`; break;
              case 'assigned_to_rider': statusMsg = `Order #${newOrder.id} has been assigned to a rider.`; break;
              case 'delivered': statusMsg = `🎉 Order #${newOrder.id} delivered! Enjoy your meal.`; break;
              default: statusMsg = `Order #${newOrder.id} status updated to ${newOrder.status}.`;
            }
            addNotification(statusMsg);
          }
        });
      }
      lastOrdersState = JSON.parse(JSON.stringify(orders));
      container.innerHTML = orders.map(order => `
        <div class="order-history-item">
          <div><strong>#${order.id}</strong> - ${getStatusText(order.status)} - GHS ${order.total}</div>
          <div style="font-size:0.7rem;">${new Date(order.createdAt).toLocaleString()}</div>
          ${order.riderName ? `<div style="font-size:0.8rem; color:#e67e22;">🚴 Rider: ${escapeHtml(order.riderName)} (${order.riderPhone || 'No phone'})</div>` : ''}
          <div class="order-buttons">
            <button class="btn-view-details" data-order='${JSON.stringify(order)}'>📋 View Details</button>
            <button class="btn-reorder" data-order='${JSON.stringify(order)}'>🔄 Reorder</button>
            ${order.riderName ? `<button class="btn-track" data-order='${JSON.stringify(order)}'>📍 Track Rider</button>` : ''}
          </div>
        </div>
      `).join('');
      attachOrderButtons();
    } catch(err) { console.error(err); }
  }

  function attachOrderButtons() {
    document.querySelectorAll('.btn-view-details').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const order = JSON.parse(btn.dataset.order);
        showOrderDetails(order);
      });
    });
    document.querySelectorAll('.btn-reorder').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const order = JSON.parse(btn.dataset.order);
        reorder(order);
      });
    });
    document.querySelectorAll('.btn-track').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const order = JSON.parse(btn.dataset.order);
        showTrackModal(order);
      });
    });
  }

  function showOrderDetails(order) {
    const itemsHtml = order.items.map(item => {
      const addonsText = item.addons?.length ? ` (${item.addons.map(a => a.name).join(', ')})` : '';
      return `<li><strong>${escapeHtml(item.name)}${addonsText}</strong> x${item.qty} = GHS ${item.totalPrice * item.qty}</li>`;
    }).join('');
    let paymentSection = '';
    if (order.status === 'pending_payment') {
      const momoNumber = order.momoNumber || '+233206802552';
      paymentSection = `
        <div class="payment-field">
          <p><strong>💰 Payment Instructions:</strong> Send total amount to mobile money number: <strong>${momoNumber}</strong></p>
          <p>After payment, enter your reference (transaction ID) below:</p>
          <input type="text" id="paymentRef" placeholder="e.g., MOMO123456" />
          <button id="submitPaymentBtn">Submit Reference</button>
        </div>
      `;
    }
    const detailsHtml = `
      <h3>Order #${order.id}</h3>
      <p><strong>Status:</strong> ${getStatusText(order.status)}</p>
      <p><strong>Date:</strong> ${new Date(order.createdAt).toLocaleString()}</p>
      <p><strong>Customer:</strong> ${escapeHtml(order.customerName)}</p>
      <p><strong>Phone:</strong> ${escapeHtml(order.customerPhone)}</p>
      <p><strong>Delivery Address:</strong> ${escapeHtml(order.address)}</p>
      <p><strong>Payment Reference:</strong> ${order.paymentReference || 'Not yet'}</p>
      <p><strong>Subtotal:</strong> GHS ${order.subtotal}</p>
      <p><strong>Delivery Fee:</strong> GHS ${order.deliveryFee}</p>
      <p><strong>Total:</strong> GHS ${order.total}</p>
      <hr>
      <p><strong>Items:</strong></p>
      <ul class="items-list">${itemsHtml}</ul>
      ${order.riderName ? `<hr><p><strong>Rider:</strong> ${escapeHtml(order.riderName)}</p><p><strong>Rider Phone:</strong> ${order.riderPhone || 'Not provided'}</p>` : '<p><em>Rider not assigned yet</em></p>'}
      ${paymentSection}
    `;
    document.getElementById('orderDetailsContent').innerHTML = detailsHtml;
    document.getElementById('orderDetailsModal').classList.add('active');
    const payBtn = document.getElementById('submitPaymentBtn');
    if (payBtn) {
      payBtn.onclick = () => {
        const ref = document.getElementById('paymentRef').value.trim();
        if (!ref) { alert('Please enter a reference'); return; }
        submitPaymentReference(order.id, ref);
      };
    }
  }

  window.closeOrderDetailsModal = () => document.getElementById('orderDetailsModal').classList.remove('active');

  function reorder(order) {
    const newCart = order.items.map(item => ({
      id: item.id, name: item.name, basePrice: item.basePrice,
      addons: item.addons || [], totalPrice: item.totalPrice, qty: item.qty || 1
    }));
    cart = newCart;
    saveCart();
    showToast('Order copied to cart');
  }

  function showTrackModal(order) {
    document.getElementById('trackRiderName').innerHTML = `<strong>Rider:</strong> ${order.riderName || 'Not assigned'}`;
    document.getElementById('trackRiderPhone').innerHTML = `<strong>Phone:</strong> ${order.riderPhone || 'Not provided'}`;
    document.getElementById('trackOrderStatus').innerHTML = `<strong>Status:</strong> ${getStatusText(order.status)}`;
    document.getElementById('trackModal').classList.add('active');
  }
  window.closeTrackModal = () => document.getElementById('trackModal').classList.remove('active');

  function escapeHtml(str) {
    return String(str).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m] || m));
  }

  const overlay = document.getElementById('cartOverlay');
  function openCart() { overlay.classList.add('open'); renderCartDrawer(); }
  function closeCart() { overlay.classList.remove('open'); }
  document.getElementById('cartIcon').addEventListener('click', openCart);
  document.getElementById('closeCartBtn').addEventListener('click', closeCart);
  document.getElementById('clearCartDrawerBtn').addEventListener('click', () => { cart = []; saveCart(); renderCartDrawer(); showToast('Cart cleared'); });

  document.getElementById('checkoutDrawerBtn').addEventListener('click', async () => {
    if (!cart.length) return alert('Cart empty');
    let name = '';
    while (true) {
      name = prompt('Enter your full name (letters only):');
      if (name === null) return;
      if (/^[A-Za-z\s\-']+$/.test(name) && name.trim().length > 0) break;
      alert('❌ Invalid name. Use only letters, spaces, hyphens, or apostrophes. No numbers.');
    }
    let phone = '';
    while (true) {
      phone = prompt('Enter your phone number (10 digits, e.g., 024XXXXXXX):');
      if (phone === null) return;
      if (/^0\d{9}$/.test(phone)) break;
      alert('❌ Invalid phone number. Must be exactly 10 digits starting with 0.');
    }
    let address = '';
    while (true) {
      address = prompt('Enter delivery address (street, city, landmark):');
      if (address === null) return;
      if (address.trim().length > 0) break;
      alert('❌ Address cannot be empty.');
    }
    await placeOrder(name, phone, address);
  });
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeCart(); });

  function startPolling() {
    if (pollInterval) clearInterval(pollInterval);
    pollInterval = setInterval(async () => { if (userId) await loadOrderHistory(); }, 15000);
  }
  loadMenu(); updateCartUI(); loadOrderHistory().then(() => startPolling());
  updateNotificationUI();
</script>
</body>
</html>
