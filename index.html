<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>QuickBite | Ghanaian Eatery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    /* ==============================================
       RESET & CSS VARIABLES
       ============================================== */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      /* ── Core palette ── */
      --orange:       #D4600A;
      --orange-mid:   #E87820;
      --orange-light: #F49842;
      --orange-glow:  rgba(212,96,10,0.15);
      --orange-pale:  #FFF0E2;
      --peach:        #FFD6B0;

      --cream:        #FFF8F2;
      --cream-mid:    #F5ECE2;
      --cream-dark:   #EDE3D7;
      --white:        #FFFFFF;

      --bark:         #3D2215;
      --bark-mid:     #6B4930;
      --bark-light:   #8E6E55;
      --bark-muted:   #AD9580;
      --bark-faint:   #C8B8A8;

      --green:        #1B7A3D;
      --green-bg:     #E6F4EA;
      --blue:         #1A65C0;
      --blue-bg:      #E2F0FF;
      --red:          #C62828;
      --red-bg:       #FFEAEA;
      --purple:       #7B2D8E;
      --purple-bg:    #F3E5F6;

      /* ── Borders / surfaces ── */
      --border:       #EAE0D5;
      --border-light: #F2ECE5;
      --surface:      var(--white);

      /* ── Shadows ── */
      --sh-xs:   0 1px 2px rgba(61,34,21,0.04);
      --sh-sm:   0 2px 8px rgba(61,34,21,0.05);
      --sh-md:   0 4px 16px rgba(61,34,21,0.07);
      --sh-lg:   0 8px 32px rgba(61,34,21,0.10);
      --sh-card: 0 2px 10px rgba(61,34,21,0.06);

      /* ── Radii ── */
      --r:    14px;
      --r-lg: 22px;
      --r-xl: 28px;
      --pill: 100px;

      /* ── Typography ── */
      --f-body:    'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --f-display: 'DM Serif Display', Georgia, serif;

      /* ── Motion ── */
      --ease:    cubic-bezier(0.16, 1, 0.3, 1);
      --spring:  cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--f-body);
      background: var(--cream);
      color: var(--bark);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Warm radial glow behind page */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 70% 50% at 15% -5%, rgba(212,96,10,0.07) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 85% 105%, rgba(142,110,85,0.05) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* ==============================================
       LAYOUT CONTAINER
       ============================================== */
    .container {
      position: relative; z-index: 1;
      max-width: 940px;
      margin: 0 auto;
      padding: 0 14px 110px;
    }

    /* ==============================================
       HEADER — frosted glass
       ============================================== */
    .header {
      position: sticky; top: 0; z-index: 20;
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(255,248,242,0.55);
      backdrop-filter: blur(24px) saturate(1.5);
      -webkit-backdrop-filter: blur(24px) saturate(1.5);
      padding: 10px 18px;
      margin-bottom: 22px;
      border-bottom: 1px solid rgba(234,224,213,0.5);
      transition: background 0.35s, box-shadow 0.35s, border-color 0.35s;
    }

    .header.scrolled {
      background: rgba(255,248,242,0.88);
      box-shadow: 0 2px 20px rgba(61,34,21,0.06);
      border-color: rgba(234,224,213,0.8);
    }

    .logo h1 {
      font-family: var(--f-display);
      font-size: 1.45rem;
      color: var(--orange);
      line-height: 1.2;
      letter-spacing: -0.01em;
    }

    .logo h1 span { font-size: 0.6rem !important; vertical-align: middle; }

    .right-icons { display: flex; align-items: center; gap: 10px; }

    .greeting {
      font-size: 0.78rem; font-weight: 600;
      color: var(--bark-mid);
      background: var(--white);
      padding: 6px 14px;
      border-radius: var(--pill);
      box-shadow: var(--sh-xs);
      border: 1px solid var(--border-light);
      white-space: nowrap;
      max-width: 170px;
      overflow: hidden; text-overflow: ellipsis;
    }

    .notification-bell,
    .cart-icon {
      position: relative; cursor: pointer;
      background: var(--white);
      width: 42px; height: 42px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--sh-sm);
      border: 1px solid var(--border-light);
      font-size: 1.15rem;
      transition: transform 0.2s var(--spring), box-shadow 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .notification-bell:active, .cart-icon:active { transform: scale(0.9); }

    .notification-badge {
      position: absolute; top: -3px; right: -3px;
      background: var(--red); color: var(--white);
      font-size: 9px; font-weight: 800;
      min-width: 18px; height: 18px;
      border-radius: var(--pill);
      display: flex; align-items: center; justify-content: center;
      padding: 0 5px;
      border: 2px solid var(--cream);
      animation: popIn 0.3s var(--spring);
    }

    .cart-count {
      position: absolute; top: -4px; right: -4px;
      background: var(--orange); color: var(--white);
      font-size: 10px; font-weight: 800;
      min-width: 20px; height: 20px;
      border-radius: var(--pill);
      display: flex; align-items: center; justify-content: center;
      padding: 0 5px;
      border: 2px solid var(--cream);
    }

    @keyframes popIn {
      0%   { transform: scale(0); }
      100% { transform: scale(1); }
    }

    /* ==============================================
       NOTIFICATION PANEL
       ============================================== */
    .notification-panel {
      position: fixed; top: 68px; right: 14px;
      width: 310px; max-height: 430px;
      background: var(--white);
      border-radius: var(--r-lg);
      box-shadow: var(--sh-lg);
      border: 1px solid var(--border);
      z-index: 2001;
      display: none; flex-direction: column;
      overflow: hidden;
      transform-origin: top right;
    }

    .notification-panel.open {
      display: flex;
      animation: panelIn 0.28s var(--ease) both;
    }

    @keyframes panelIn {
      from { opacity: 0; transform: scale(0.92) translateY(-6px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .notification-header {
      padding: 13px 18px;
      background: linear-gradient(135deg, var(--orange), var(--orange-mid));
      color: var(--white);
      font-weight: 700; font-size: 0.85rem;
      letter-spacing: 0.03em;
    }

    .notification-list {
      max-height: 370px; overflow-y: auto;
      padding: 6px;
      font-size: 0.82rem; color: var(--bark-mid);
    }

    .notification-item {
      padding: 10px 12px;
      border-radius: var(--r);
      margin-bottom: 3px;
      font-size: 0.78rem;
      line-height: 1.5;
      transition: background 0.2s;
    }

    .notification-item:last-child { margin-bottom: 0; }

    /* ==============================================
       CATEGORY PILLS
       ============================================== */
    .categories {
      display: flex; gap: 8px;
      overflow-x: auto;
      margin-bottom: 18px;
      padding: 2px 0;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .categories::-webkit-scrollbar { display: none; }

    .cat-btn {
      background: var(--white);
      padding: 8px 20px;
      border-radius: var(--pill);
      font-weight: 600; font-size: 0.8rem;
      white-space: nowrap;
      cursor: pointer;
      border: 1.5px solid var(--border);
      color: var(--bark-mid);
      transition: all 0.22s var(--ease);
      -webkit-tap-highlight-color: transparent;
      text-transform: capitalize;
    }

    .cat-btn:hover {
      border-color: var(--orange-light);
      color: var(--orange);
    }

    .cat-btn.active {
      background: var(--orange);
      color: var(--white);
      border-color: var(--orange);
      box-shadow: 0 3px 14px rgba(212,96,10,0.28);
    }

    /* ==============================================
       MENU GRID
       ============================================== */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    @media (min-width: 580px) { .menu-grid { grid-template-columns: repeat(3, 1fr); gap: 16px; } }
    @media (min-width: 880px) { .menu-grid { grid-template-columns: repeat(4, 1fr); gap: 18px; } }

    .loading {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--bark-muted);
      font-size: 0.9rem;
    }

    /* ==============================================
       ITEM CARD
       ============================================== */
    .item-card {
      background: var(--white);
      border-radius: var(--r-lg);
      overflow: hidden;
      box-shadow: var(--sh-card);
      border: 1px solid var(--border-light);
      transition: transform 0.28s var(--ease), box-shadow 0.28s;
      animation: cardUp 0.45s var(--ease) both;
    }

    .item-card:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: var(--sh-md);
    }

    .item-card:active {
      transform: translateY(-1px) scale(0.995);
    }

    @keyframes cardUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .item-card:nth-child(1)  { animation-delay: 0.03s; }
    .item-card:nth-child(2)  { animation-delay: 0.07s; }
    .item-card:nth-child(3)  { animation-delay: 0.11s; }
    .item-card:nth-child(4)  { animation-delay: 0.15s; }
    .item-card:nth-child(5)  { animation-delay: 0.19s; }
    .item-card:nth-child(6)  { animation-delay: 0.23s; }
    .item-card:nth-child(7)  { animation-delay: 0.27s; }
    .item-card:nth-child(8)  { animation-delay: 0.31s; }
    .item-card:nth-child(9)  { animation-delay: 0.34s; }
    .item-card:nth-child(10) { animation-delay: 0.37s; }

    .item-img {
      background: linear-gradient(160deg, var(--orange-pale), #FFF4E8);
      text-align: center;
      font-size: 2.8rem;
      padding: 22px 0 18px;
      position: relative;
    }

    .item-img::after {
      content: '';
      position: absolute;
      width: 52px; height: 52px;
      border-radius: 50%;
      background: rgba(255,255,255,0.55);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }

    .item-details { padding: 12px 14px 14px; }

    .item-name {
      font-weight: 700; font-size: 0.86rem;
      color: var(--bark);
      line-height: 1.25;
      margin-bottom: 3px;
    }

    .item-price {
      font-family: var(--f-display);
      color: var(--orange);
      font-size: 0.95rem;
      margin-bottom: 6px;
    }

    .addons {
      margin: 5px 0;
      font-size: 0.7rem;
      display: flex; flex-wrap: wrap; gap: 5px;
    }

    .addon-check {
      background: var(--cream-mid);
      border-radius: var(--pill);
      padding: 3px 9px;
      display: inline-flex; align-items: center; gap: 4px;
      cursor: pointer;
      font-size: 0.67rem;
      color: var(--bark-mid);
      border: 1px solid transparent;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .addon-check:has(input:checked) {
      background: var(--orange-pale);
      border-color: var(--peach);
      color: var(--orange);
    }

    .addon-check input[type="checkbox"] {
      width: 11px; height: 11px;
      accent-color: var(--orange);
      margin: 0;
    }

    .item-total {
      font-size: 0.7rem; font-weight: 600;
      margin: 5px 0; text-align: right;
      color: var(--bark-light);
    }

    .btn-add {
      background: var(--orange);
      color: var(--white);
      border: none; width: 100%;
      padding: 10px;
      border-radius: var(--pill);
      font-weight: 700; font-size: 0.8rem;
      cursor: pointer; margin-top: 6px;
      transition: transform 0.15s var(--spring), box-shadow 0.2s, background 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-add:hover {
      background: var(--orange-mid);
      box-shadow: 0 4px 18px rgba(212,96,10,0.3);
    }
    .btn-add:active { transform: scale(0.95); }

    /* ==============================================
       CART OVERLAY & DRAWER
       ============================================== */
    .cart-overlay {
      position: fixed; inset: 0;
      background: rgba(61,33,21,0.4);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      z-index: 1000;
      visibility: hidden; opacity: 0;
      transition: all 0.35s var(--ease);
    }
    .cart-overlay.open { visibility: visible; opacity: 1; }

    .cart-drawer {
      position: fixed; top: 0; right: 0; bottom: 0;
      width: 88%; max-width: 390px;
      background: var(--white);
      display: flex; flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.4s var(--ease);
      z-index: 1001;
      border-radius: var(--r-xl) 0 0 var(--r-xl);
      box-shadow: -6px 0 36px rgba(61,34,21,0.12);
    }
    .cart-overlay.open .cart-drawer { transform: translateX(0); }

    .cart-header {
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
      font-family: var(--f-display);
      font-size: 1.15rem;
      color: var(--bark);
    }

    .cart-header button {
      background: var(--cream-mid) !important;
      border: none !important;
      width: 34px; height: 34px;
      border-radius: 50%;
      font-size: 1rem !important;
      cursor: pointer !important;
      display: flex; align-items: center; justify-content: center;
      color: var(--bark-mid);
      transition: background 0.2s;
    }
    .cart-header button:hover { background: var(--cream-dark) !important; }

    .cart-items { flex: 1; overflow-y: auto; padding: 14px 20px; }

    .empty-cart {
      text-align: center; padding: 44px 20px;
      color: var(--bark-muted); font-size: 0.88rem;
    }

    .cart-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-light);
    }
    .cart-item:last-child { border-bottom: none; }

    .cart-item-info { flex: 1; min-width: 0; }

    .cart-item-name {
      font-weight: 600; font-size: 0.86rem;
      color: var(--bark); line-height: 1.3;
      word-break: break-word;
    }

    .cart-item-addons {
      font-size: 0.7rem; color: var(--bark-muted); margin-top: 2px;
    }

    .cart-item-qty {
      display: flex; align-items: center; gap: 4px;
      margin: 0 10px; flex-shrink: 0;
    }

    .cart-item-qty button {
      background: var(--cream-mid);
      border: 1.5px solid var(--border);
      width: 30px; height: 30px;
      border-radius: 50%;
      font-weight: 800; font-size: 1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--bark-mid);
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
      line-height: 1;
    }
    .cart-item-qty button:hover {
      background: var(--orange-pale);
      border-color: var(--peach);
      color: var(--orange);
    }
    .cart-item-qty button:active { transform: scale(0.88); }

    .cart-item-qty span {
      font-weight: 700; font-size: 0.88rem;
      min-width: 22px; text-align: center;
    }

    .cart-item-price {
      font-weight: 700; font-size: 0.86rem;
      min-width: 68px; text-align: right;
      color: var(--bark); flex-shrink: 0;
    }

    .cart-footer {
      padding: 16px 20px 20px;
      border-top: 1px solid var(--border);
      background: var(--cream);
    }

    .cart-total {
      display: flex; justify-content: space-between;
      font-weight: 600; margin-bottom: 14px;
      font-size: 0.88rem; color: var(--bark);
    }

    .cart-total span:last-child {
      text-align: right; font-size: 0.8rem; line-height: 1.5;
    }

    .cart-actions { display: flex; gap: 10px; }

    .btn-checkout, .btn-clear {
      flex: 1; padding: 13px;
      border-radius: var(--pill);
      border: none;
      font-weight: 700; font-size: 0.86rem;
      cursor: pointer;
      transition: all 0.2s var(--ease);
      -webkit-tap-highlight-color: transparent;
    }

    .btn-checkout {
      background: var(--orange); color: var(--white);
      box-shadow: 0 4px 18px rgba(212,96,10,0.22);
    }
    .btn-checkout:hover { background: var(--orange-mid); box-shadow: 0 6px 22px rgba(212,96,10,0.3); }
    .btn-checkout:active { transform: scale(0.97); }
    .btn-checkout:disabled { opacity: 0.55; cursor: not-allowed; }

    .btn-clear {
      background: var(--cream-dark); color: var(--bark-mid);
      border: 1px solid var(--border);
    }
    .btn-clear:hover { background: var(--border); }

    /* ==============================================
       TOAST
       ============================================== */
    .toast {
      position: fixed; bottom: 90px; left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: var(--bark);
      color: var(--white);
      font-size: 0.8rem; font-weight: 500;
      padding: 10px 22px;
      border-radius: var(--pill);
      z-index: 1100;
      opacity: 0;
      transition: opacity 0.25s, transform 0.3s var(--ease);
      box-shadow: var(--sh-lg);
      max-width: 88%; text-align: center;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ==============================================
       ORDER HISTORY SECTION
       ============================================== */
    .history-section {
      margin-top: 36px;
      background: var(--white);
      border-radius: var(--r-xl);
      padding: 22px 18px;
      box-shadow: var(--sh-card);
      border: 1px solid var(--border-light);
    }

    .history-title {
      font-family: var(--f-display);
      font-size: 1.15rem;
      margin-bottom: 14px;
      color: var(--bark);
    }

    /* Each order rendered as its own card */
    .order-history-item {
      background: var(--cream);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 16px;
      margin-bottom: 12px;
      transition: box-shadow 0.2s;
    }
    .order-history-item:last-child { margin-bottom: 0; }
    .order-history-item:hover { box-shadow: var(--sh-sm); }

    /* ── Status badges (used inside order cards) ── */
    .status-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: var(--pill);
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      vertical-align: middle;
    }

    .status-pending_payment { background: #FFF3E0; color: #BF6900; }
    .status-paid            { background: var(--green-bg); color: var(--green); }
    .status-confirmed       { background: var(--blue-bg);  color: var(--blue); }
    .status-processing      { background: var(--purple-bg); color: var(--purple); }
    .status-completed       { background: #E0F2F1; color: #00695C; }
    .status-assigned_to_rider { background: var(--orange-pale); color: var(--orange); }
    .status-delivered        { background: var(--green-bg); color: var(--green); }
    .status-cancelled        { background: var(--red-bg); color: var(--red); }

    /* Order card inner layout */
    .order-card-top {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 6px;
      margin-bottom: 6px;
    }

    .order-card-id {
      font-family: var(--f-display);
      font-size: 1rem; color: var(--orange);
    }

    .order-card-meta {
      font-size: 0.72rem; color: var(--bark-muted);
      margin-bottom: 4px;
    }

    .order-card-total {
      font-weight: 700; font-size: 0.92rem;
      color: var(--bark);
      margin-bottom: 6px;
    }

    .order-card-rider {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.78rem; color: var(--orange);
      background: var(--orange-pale);
      padding: 6px 12px;
      border-radius: var(--r);
      margin-bottom: 10px;
    }

    .order-buttons {
      display: flex; flex-wrap: wrap; gap: 8px;
      padding-top: 10px;
      border-top: 1px solid var(--border-light);
    }

    .btn-reorder, .btn-view-details, .btn-track {
      border: none; color: var(--white);
      padding: 7px 14px;
      border-radius: var(--pill);
      font-size: 0.7rem; font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.2s;
      -webkit-tap-highlight-color: transparent;
      letter-spacing: 0.02em;
    }
    .btn-reorder       { background: var(--orange); }
    .btn-view-details  { background: var(--blue); }
    .btn-track         { background: var(--green); }

    .btn-reorder:hover      { box-shadow: 0 3px 12px rgba(212,96,10,0.3); }
    .btn-view-details:hover { box-shadow: 0 3px 12px rgba(26,101,192,0.3); }
    .btn-track:hover        { box-shadow: 0 3px 12px rgba(27,122,61,0.3); }

    .btn-reorder:active, .btn-view-details:active, .btn-track:active {
      transform: scale(0.94);
    }

    /* ==============================================
       MODALS
       ============================================== */
    .modal {
      position: fixed; inset: 0;
      background: rgba(61,34,21,0.5);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      z-index: 2000;
      display: none; align-items: center; justify-content: center;
      padding: 20px;
    }
    .modal.active {
      display: flex;
      animation: fadeIn 0.25s var(--ease);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .modal-content {
      background: var(--white);
      border-radius: var(--r-xl);
      padding: 26px 22px;
      width: 100%; max-width: 500px;
      max-height: 85vh; overflow-y: auto;
      box-shadow: var(--sh-lg);
      border: 1px solid var(--border);
      animation: slideUp 0.32s var(--ease);
      line-height: 1.7; font-size: 0.88rem;
    }

    @keyframes slideUp {
      from { transform: translateY(18px); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }

    .modal-content h3 {
      font-family: var(--f-display);
      font-size: 1.2rem;
      margin-bottom: 10px;
      color: var(--bark);
    }

    .modal-content p { margin-bottom: 5px; color: var(--bark-mid); }
    .modal-content strong { color: var(--bark); }

    .modal-content hr {
      border: none;
      border-top: 1px solid var(--border-light);
      margin: 12px 0;
    }

    .modal-content ul { padding-left: 18px; margin: 8px 0; }
    .modal-content li { margin-bottom: 4px; font-size: 0.83rem; }

    .modal-close {
      float: right;
      background: var(--cream-mid); border: none;
      width: 32px; height: 32px; border-radius: 50%;
      font-size: 1.1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--bark-mid); line-height: 1;
      transition: background 0.2s;
    }
    .modal-close:hover { background: var(--cream-dark); }

    /* Payment field */
    .payment-field {
      margin-top: 16px; padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .payment-field p { font-size: 0.84rem; margin-bottom: 6px; }

    .payment-field input {
      width: 100%; padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: var(--pill);
      margin: 8px 0; font-size: 0.86rem;
      outline: none;
      font-family: var(--f-body);
      background: var(--cream);
      transition: border-color 0.2s, background 0.2s;
    }
    .payment-field input:focus {
      border-color: var(--orange);
      background: var(--white);
    }

    .payment-field button {
      background: var(--orange); color: var(--white);
      border: none; padding: 12px;
      border-radius: var(--pill); width: 100%;
      font-weight: 700; font-size: 0.88rem;
      cursor: pointer; margin-top: 4px;
      transition: transform 0.15s, box-shadow 0.2s;
    }
    .payment-field button:hover { box-shadow: 0 4px 16px rgba(212,96,10,0.25); }
    .payment-field button:active { transform: scale(0.97); }
    .payment-field button:disabled { opacity: 0.55; cursor: not-allowed; }

    /* ==============================================
       SCROLLBAR
       ============================================== */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

    /* ==============================================
       RESPONSIVE
       ============================================== */
    @media (max-width: 420px) {
      .greeting { display: none; }
      .header { padding: 9px 12px; }
      .logo h1 { font-size: 1.25rem; }
      .container { padding: 0 10px 100px; }
      .menu-grid { gap: 10px; }
      .item-img { font-size: 2.3rem; padding: 16px 0 14px; }
      .item-details { padding: 10px 11px 12px; }
      .item-name { font-size: 0.8rem; }
      .item-price { font-size: 0.88rem; }
      .btn-add { padding: 9px; font-size: 0.76rem; }
      .history-section { padding: 16px 14px; }
      .order-history-item { padding: 14px 12px; }
    }

    @media (min-width: 768px) {
      .container { padding: 0 24px 110px; }
      .header { border-radius: var(--r-lg); margin-top: 10px; }
      .history-section { padding: 26px 28px; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header" id="pageHeader">
    <div class="logo"><h1>🍛 QuickBite <span style="font-size:0.7rem;">🇬🇭</span></h1></div>
    <div class="right-icons">
      <div class="greeting" id="greeting">Loading...</div>
      <div class="notification-bell" id="notificationBell">
        🔔
        <span class="notification-badge" id="notificationBadge" style="display: none;">0</span>
      </div>
      <div class="cart-icon" id="cartIcon">🛒<span class="cart-count" id="cartCount">0</span></div>
    </div>
  </div>

  <div id="notificationPanel" class="notification-panel">
    <div class="notification-header">Notifications</div>
    <div id="notificationList" class="notification-list">No new notifications</div>
  </div>

  <div id="categories" class="categories"></div>
  <div id="menuGrid" class="menu-grid"><div class="loading">Loading menu...</div></div>
  <div class="history-section">
    <div class="history-title">🕒 Your Recent Orders</div>
    <div id="orderHistoryList">Loading...</div>
  </div>
</div>

<div id="cartOverlay" class="cart-overlay">
  <div class="cart-drawer">
    <div class="cart-header"><span>🛒 Your Cart</span><button id="closeCartBtn" style="background:none; border:none; font-size:1.2rem; cursor:pointer;">✕</button></div>
    <div id="cartDrawerItems" class="cart-items">Empty</div>
    <div class="cart-footer">
      <div class="cart-total"><span>Total</span><span id="cartDrawerTotal">GHS 0.00</span></div>
      <div class="cart-actions">
        <button id="clearCartDrawerBtn" class="btn-clear">Clear</button>
        <button id="checkoutDrawerBtn" class="btn-checkout">Checkout →</button>
      </div>
    </div>
  </div>
</div>

<div id="orderDetailsModal" class="modal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeOrderDetailsModal()">&times;</button>
    <div id="orderDetailsContent"></div>
  </div>
</div>
<div id="trackModal" class="modal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeTrackModal()">&times;</button>
    <h3>🚴 Rider Status</h3>
    <p id="trackRiderName"></p>
    <p id="trackRiderPhone"></p>
    <p id="trackOrderStatus"></p>
  </div>
</div>

<script>
  /* =========================================================
     TELEGRAM WEBAPP INITIALIZATION — robust name detection
     ========================================================= */
  let tg = null;
  let user = null;

  // 1. Try reading from Telegram WebApp API
  try {
    if (window.Telegram && window.Telegram.WebApp) {
      tg = window.Telegram.WebApp;
      tg.expand();

      // Primary: initDataUnsafe.user (available when WebApp is opened from bot)
      user = tg.initDataUnsafe?.user || null;

      // Fallback: parse initData query string if user object is empty
      if (!user && tg.initData) {
        try {
          const params = new URLSearchParams(tg.initData);
          const userJson = params.get('user');
          if (userJson) user = JSON.parse(decodeURIComponent(userJson));
        } catch(parseErr) {
          console.log('Could not parse initData:', parseErr);
        }
      }
    }
  } catch(e) {
    console.log('Telegram WebApp not available (running in browser)');
  }

  // 2. Resolve user ID — Telegram ID > localStorage > random
  let userId = null;
  if (user?.id) {
    userId = String(user.id);
  } else {
    userId = localStorage.getItem('userId');
  }
  if (!userId) {
    userId = 'user_' + Math.random().toString(36).substr(2, 10);
  }
  localStorage.setItem('userId', userId);

  // 3. Resolve user name — Telegram first_name > localStorage > prompt once > default
  let userName = '';
  if (user?.first_name && user.first_name.trim()) {
    // Got a valid Telegram first name — use and persist it
    userName = user.first_name.trim();
    localStorage.setItem('userName', userName);
  } else {
    // No Telegram name — try stored name
    userName = localStorage.getItem('userName') || '';
  }

  // If still no name (browser user, first visit), prompt once
  if (!userName) {
    const prompted = prompt('Welcome to QuickBite! What should we call you?');
    userName = (prompted && prompted.trim()) ? prompted.trim() : 'Customer';
    localStorage.setItem('userName', userName);
  }

  document.getElementById('greeting').innerText = `👋 Hello, ${userName}`;


  /* =========================================================
     APP STATE
     ========================================================= */
  const API_BASE = 'https://quickbite-joi1.onrender.com';
  let menu = [], cart = JSON.parse(localStorage.getItem('cart') || '[]'), activeCategory = 'all';
  let isCheckingOut = false, lastOrdersState = [], pollInterval = null;
  let notifications = JSON.parse(localStorage.getItem('notifications') || '[]');
  let unreadCount = notifications.filter(n => !n.read).length;

  // Status text mapping
  function getStatusText(status) {
    const map = {
      'pending_payment': 'Awaiting Payment',
      'paid': 'Payment Received',
      'confirmed': 'Order Confirmed',
      'processing': 'Preparing',
      'completed': 'Ready for Delivery',
      'assigned_to_rider': 'Order on its way 🚴',
      'delivered': 'Delivered 🎉'
    };
    return map[status] || status.replace(/_/g, ' ');
  }

  // Status → CSS class for badges
  function getStatusClass(status) {
    return 'status-' + (status || '').replace(/\s/g, '_');
  }


  /* =========================================================
     NOTIFICATIONS & SOUND
     ========================================================= */
  function playBeep() {
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      oscillator.frequency.value = 800;
      gainNode.gain.value = 0.2;
      oscillator.start();
      gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.5);
      oscillator.stop(audioCtx.currentTime + 0.5);
    } catch(e) { console.log('Beep not supported'); }
  }

  function addNotification(message) {
    const newNotif = { id: Date.now(), message, timestamp: new Date().toLocaleTimeString(), read: false };
    notifications.unshift(newNotif);
    if (notifications.length > 50) notifications.pop();
    localStorage.setItem('notifications', JSON.stringify(notifications));
    unreadCount = notifications.filter(n => !n.read).length;
    updateNotificationUI();
    playBeep();
    showToast(message);
  }

  function updateNotificationUI() {
    const badge = document.getElementById('notificationBadge');
    if (unreadCount > 0) {
      badge.style.display = 'flex';
      badge.innerText = unreadCount > 9 ? '9+' : unreadCount;
    } else {
      badge.style.display = 'none';
    }
    const listDiv = document.getElementById('notificationList');
    if (notifications.length === 0) {
      listDiv.innerHTML = 'No notifications';
    } else {
      listDiv.innerHTML = notifications.map(n => `
        <div class="notification-item" data-id="${n.id}" style="opacity: ${n.read ? 0.6 : 1}; background: ${n.read ? '#f9f9f9' : '#fff3e0'};">
          <div>${n.message}</div>
          <div style="font-size: 10px; color: #888;">${n.timestamp}</div>
        </div>
      `).join('');
    }
  }

  function markAllAsRead() {
    notifications.forEach(n => n.read = true);
    unreadCount = 0;
    localStorage.setItem('notifications', JSON.stringify(notifications));
    updateNotificationUI();
  }

  const bell = document.getElementById('notificationBell');
  const panel = document.getElementById('notificationPanel');
  bell.addEventListener('click', (e) => {
    e.stopPropagation();
    if (panel.classList.contains('open')) {
      panel.classList.remove('open');
    } else {
      markAllAsRead();
      updateNotificationUI();
      panel.classList.add('open');
    }
  });
  document.addEventListener('click', (e) => {
    if (!panel.contains(e.target) && e.target !== bell) {
      panel.classList.remove('open');
    }
  });


  /* =========================================================
     TOAST
     ========================================================= */
  function showToast(msg) {
    let toast = document.querySelector('.toast');
    if (!toast) { toast = document.createElement('div'); toast.className = 'toast'; document.body.appendChild(toast); }
    toast.innerText = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }


  /* =========================================================
     HEADER SCROLL EFFECT
     ========================================================= */
  const header = document.getElementById('pageHeader');
  window.addEventListener('scroll', () => header.classList.toggle('scrolled', window.scrollY > 20));


  /* =========================================================
     CART STATE
     ========================================================= */
  function saveCart() { localStorage.setItem('cart', JSON.stringify(cart)); updateCartUI(); renderCartDrawer(); }
  function updateCartUI() { document.getElementById('cartCount').innerText = cart.reduce((s,i) => s + i.qty, 0); }


  /* =========================================================
     MENU
     ========================================================= */
  async function loadMenu() {
    try {
      const res = await fetch(`${API_BASE}/api/menu`);
      if (!res.ok) throw new Error();
      menu = await res.json();
      renderCategories(); renderMenu();
    } catch(err) { document.getElementById('menuGrid').innerHTML = '<div style="text-align:center; padding:40px;">⚠️ Could not load menu</div>'; }
  }

  function renderCategories() {
    const cats = ['all', ...new Set(menu.map(i => i.category))];
    const container = document.getElementById('categories');
    container.innerHTML = cats.map(c => `<div class="cat-btn ${c === activeCategory ? 'active' : ''}" data-cat="${c}">${c === 'all' ? 'All' : c}</div>`).join('');
    document.querySelectorAll('.cat-btn').forEach(btn => btn.addEventListener('click', () => {
      activeCategory = btn.dataset.cat;
      renderCategories(); renderMenu();
    }));
  }

  function renderMenu() {
    let filtered = activeCategory === 'all' ? menu : menu.filter(i => i.category === activeCategory);
    const grid = document.getElementById('menuGrid');
    grid.innerHTML = filtered.map(item => `
      <div class="item-card">
        <div class="item-img">${item.emoji || '🍽️'}</div>
        <div class="item-details">
          <div class="item-name">${escapeHtml(item.name)}</div>
          <div class="item-price">GHS ${item.basePrice}</div>
          <div class="addons" id="addons-${item.id}"></div>
          <div class="item-total" id="total-${item.id}">Item total: GHS ${item.basePrice}</div>
          <button class="btn-add" data-id="${item.id}">Add to Cart</button>
        </div>
      </div>
    `).join('');
    menu.forEach(item => {
      const container = document.getElementById(`addons-${item.id}`);
      if (container && item.addons?.length) {
        container.innerHTML = item.addons.map(addon => `<label class="addon-check"><input type="checkbox" class="addon-cb" data-item="${item.id}" data-addon='${JSON.stringify(addon)}'> ${addon.name} +GHS ${addon.price}</label>`).join('');
        document.querySelectorAll(`#addons-${item.id} .addon-cb`).forEach(cb => cb.addEventListener('change', () => updateItemTotal(item.id)));
      }
      updateItemTotal(item.id);
      const btn = document.querySelector(`.btn-add[data-id="${item.id}"]`);
      if (btn) btn.addEventListener('click', () => addToCart(item.id));
    });
  }

  function updateItemTotal(itemId) {
    const item = menu.find(i => i.id === itemId);
    if (!item) return;
    let total = item.basePrice;
    document.querySelectorAll(`#addons-${itemId} .addon-cb:checked`).forEach(cb => total += JSON.parse(cb.dataset.addon).price);
    const span = document.getElementById(`total-${itemId}`);
    if (span) span.innerText = `Item total: GHS ${total}`;
  }

  function addToCart(itemId) {
    const item = menu.find(i => i.id === itemId);
    if (!item) return;
    const selectedAddons = [];
    document.querySelectorAll(`#addons-${itemId} .addon-cb:checked`).forEach(cb => selectedAddons.push(JSON.parse(cb.dataset.addon)));
    const itemTotal = item.basePrice + selectedAddons.reduce((s,a) => s + a.price, 0);
    const cartItem = { id: item.id, name: item.name, basePrice: item.basePrice, addons: selectedAddons, totalPrice: itemTotal, qty: 1 };
    const existing = cart.find(c => c.id === itemId && JSON.stringify(c.addons) === JSON.stringify(selectedAddons));
    if (existing) existing.qty++;
    else cart.push(cartItem);
    saveCart();
    showToast(`➕ ${item.name} added`);
  }


  /* =========================================================
     CART DRAWER
     ========================================================= */
  function renderCartDrawer() {
    const container = document.getElementById('cartDrawerItems');
    const totalSpan = document.getElementById('cartDrawerTotal');
    if (!cart.length) {
      container.innerHTML = '<div class="empty-cart">Your cart is empty</div>';
      totalSpan.innerHTML = 'GHS 0.00';
      return;
    }
    let html = '', subtotal = 0;
    cart.forEach((item, idx) => {
      const addonText = item.addons.length ? ` (${item.addons.map(a=>a.name).join(', ')})` : '';
      const lineTotal = item.totalPrice * item.qty;
      subtotal += lineTotal;
      html += `<div class="cart-item" data-idx="${idx}">
        <div class="cart-item-info"><div class="cart-item-name">${escapeHtml(item.name)}${addonText}</div><div class="cart-item-addons">GHS ${item.totalPrice} each</div></div>
        <div class="cart-item-qty"><button onclick="changeQty(${idx}, -1)">-</button><span>${item.qty}</span><button onclick="changeQty(${idx}, 1)">+</button></div>
        <div class="cart-item-price">GHS ${lineTotal.toFixed(2)}</div>
      </div>`;
    });
    const total = subtotal + 5.00;
    container.innerHTML = html;
    totalSpan.innerHTML = `Subtotal: GHS ${subtotal.toFixed(2)}<br>+ Delivery: GHS 5.00<br><strong>Total: GHS ${total.toFixed(2)}</strong>`;
  }

  window.changeQty = (idx, delta) => {
    const newQty = cart[idx].qty + delta;
    if (newQty <= 0) cart.splice(idx, 1);
    else cart[idx].qty = newQty;
    saveCart();
  };


  /* =========================================================
     CHECKOUT
     ========================================================= */
  async function placeOrder(customerName, customerPhone, address) {
    if (isCheckingOut) return;
    isCheckingOut = true;
    const btn = document.getElementById('checkoutDrawerBtn');
    btn.disabled = true; btn.innerText = 'Placing order...';
    const items = cart.map(i => ({ id: i.id, name: i.name, basePrice: i.basePrice, addons: i.addons, qty: i.qty }));
    try {
      const res = await fetch(`${API_BASE}/api/orders`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId, items, address, customerName, customerPhone })
      });
      const data = await res.json();
      if (res.ok) {
        cart = []; saveCart(); closeCart();
        showToast(`✅ Order #${data.orderId} placed!`);
        alert(`✅ Order #${data.orderId}\nTotal: GHS ${data.total}\nSend payment to: ${data.momoNumber}\nAfter payment, enter the reference in the order details.\nRider contact: ${data.riderContact}`);
        await loadOrderHistory();
      } else {
        alert('Order failed: ' + (data.error || 'Unknown error'));
      }
    } catch (err) {
      console.error(err);
      alert('Network error. Please try again.');
    } finally {
      isCheckingOut = false;
      btn.disabled = false;
      btn.innerText = 'Checkout →';
    }
  }


  /* =========================================================
     PAYMENT REFERENCE
     ========================================================= */
  async function submitPaymentReference(orderId, reference) {
    const btn = document.querySelector('#orderDetailsModal .payment-field button');
    if (btn) { btn.disabled = true; btn.innerText = 'Submitting...'; }
    try {
      const res = await fetch(`${API_BASE}/api/orders/${orderId}/payment-reference`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ reference })
      });
      const data = await res.json();
      if (res.ok) {
        showToast('✅ Payment reference submitted! Awaiting admin confirmation.');
        await loadOrderHistory();
        setTimeout(() => closeOrderDetailsModal(), 1500);
      } else {
        alert('Error: ' + data.error);
      }
    } catch (err) {
      alert('Network error. Please try again.');
    } finally {
      if (btn) { btn.disabled = false; btn.innerText = 'Submit Reference'; }
    }
  }


  /* =========================================================
     ORDER HISTORY — redesigned card template
     ========================================================= */
  async function loadOrderHistory() {
    try {
      const res = await fetch(`${API_BASE}/api/orders/${userId}`);
      const orders = await res.json();
      const container = document.getElementById('orderHistoryList');
      if (!orders.length) { container.innerHTML = '<div style="text-align:center; padding:20px; color:var(--bark-muted); font-size:0.88rem;">No orders yet. Browse the menu above!</div>'; return; }
      if (lastOrdersState.length > 0) {
        orders.forEach(newOrder => {
          const oldOrder = lastOrdersState.find(o => o.id === newOrder.id);
          if (oldOrder && oldOrder.status !== newOrder.status) {
            let statusMsg = '';
            switch (newOrder.status) {
              case 'confirmed': statusMsg = `Order #${newOrder.id} payment confirmed! We are preparing your meal.`; break;
              case 'processing': statusMsg = `Order #${newOrder.id} is now being prepared.`; break;
              case 'completed': statusMsg = `Order #${newOrder.id} is ready for delivery.`; break;
              case 'assigned_to_rider': statusMsg = `Order #${newOrder.id} has been assigned to a rider.`; break;
              case 'delivered': statusMsg = `🎉 Order #${newOrder.id} delivered! Enjoy your meal.`; break;
              default: statusMsg = `Order #${newOrder.id} status updated to ${newOrder.status}.`;
            }
            addNotification(statusMsg);
          }
        });
      }
      lastOrdersState = JSON.parse(JSON.stringify(orders));

      container.innerHTML = orders.map(order => `
        <div class="order-history-item">
          <div class="order-card-top">
            <span class="order-card-id">#${order.id}</span>
            <span class="status-badge ${getStatusClass(order.status)}">${getStatusText(order.status)}</span>
          </div>
          <div class="order-card-meta">${new Date(order.createdAt).toLocaleString()}</div>
          <div class="order-card-total">GHS ${order.total}</div>
          ${order.riderName ? `<div class="order-card-rider">🚴 ${escapeHtml(order.riderName)} &middot; ${order.riderPhone || 'No phone'}</div>` : ''}
          <div class="order-buttons">
            <button class="btn-view-details" data-order='${JSON.stringify(order)}'>📋 Details</button>
            <button class="btn-reorder" data-order='${JSON.stringify(order)}'>🔄 Reorder</button>
            ${order.riderName ? `<button class="btn-track" data-order='${JSON.stringify(order)}'>📍 Track</button>` : ''}
          </div>
        </div>
      `).join('');
      attachOrderButtons();
    } catch(err) { console.error(err); }
  }


  /* =========================================================
     ORDER BUTTON EVENT BINDING
     ========================================================= */
  function attachOrderButtons() {
    document.querySelectorAll('.btn-view-details').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const order = JSON.parse(btn.dataset.order);
        showOrderDetails(order);
      });
    });
    document.querySelectorAll('.btn-reorder').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const order = JSON.parse(btn.dataset.order);
        reorder(order);
      });
    });
    document.querySelectorAll('.btn-track').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const order = JSON.parse(btn.dataset.order);
        showTrackModal(order);
      });
    });
  }


  /* =========================================================
     ORDER DETAILS MODAL
     ========================================================= */
  function showOrderDetails(order) {
    const itemsHtml = order.items.map(item => {
      const addonsText = item.addons?.length ? ` (${item.addons.map(a => a.name).join(', ')})` : '';
      return `<li><strong>${escapeHtml(item.name)}${addonsText}</strong> x${item.qty} = GHS ${item.totalPrice * item.qty}</li>`;
    }).join('');
    let paymentSection = '';
    if (order.status === 'pending_payment') {
      const momoNumber = order.momoNumber || '+233206802552';
      paymentSection = `
        <div class="payment-field">
          <p><strong>💰 Payment Instructions:</strong> Send total amount to mobile money number: <strong>${momoNumber}</strong></p>
          <p>After payment, enter your reference (transaction ID) below:</p>
          <input type="text" id="paymentRef" placeholder="e.g., MOMO123456" />
          <button id="submitPaymentBtn">Submit Reference</button>
        </div>
      `;
    }
    const detailsHtml = `
      <h3>Order #${order.id}</h3>
      <p><strong>Status:</strong> ${getStatusText(order.status)}</p>
      <p><strong>Date:</strong> ${new Date(order.createdAt).toLocaleString()}</p>
      <p><strong>Customer:</strong> ${escapeHtml(order.customerName)}</p>
      <p><strong>Phone:</strong> ${escapeHtml(order.customerPhone)}</p>
      <p><strong>Delivery Address:</strong> ${escapeHtml(order.address)}</p>
      <p><strong>Payment Reference:</strong> ${order.paymentReference || 'Not yet'}</p>
      <p><strong>Subtotal:</strong> GHS ${order.subtotal}</p>
      <p><strong>Delivery Fee:</strong> GHS ${order.deliveryFee}</p>
      <p><strong>Total:</strong> GHS ${order.total}</p>
      <hr>
      <p><strong>Items:</strong></p>
      <ul class="items-list">${itemsHtml}</ul>
      ${order.riderName ? `<hr><p><strong>Rider:</strong> ${escapeHtml(order.riderName)}</p><p><strong>Rider Phone:</strong> ${order.riderPhone || 'Not provided'}</p>` : '<p><em>Rider not assigned yet</em></p>'}
      ${paymentSection}
    `;
    document.getElementById('orderDetailsContent').innerHTML = detailsHtml;
    document.getElementById('orderDetailsModal').classList.add('active');
    const payBtn = document.getElementById('submitPaymentBtn');
    if (payBtn) {
      payBtn.onclick = () => {
        const ref = document.getElementById('paymentRef').value.trim();
        if (!ref) { alert('Please enter a reference'); return; }
        submitPaymentReference(order.id, ref);
      };
    }
  }

  window.closeOrderDetailsModal = () => document.getElementById('orderDetailsModal').classList.remove('active');


  /* =========================================================
     REORDER
     ========================================================= */
  function reorder(order) {
    const newCart = order.items.map(item => ({
      id: item.id, name: item.name, basePrice: item.basePrice,
      addons: item.addons || [], totalPrice: item.totalPrice, qty: item.qty || 1
    }));
    cart = newCart;
    saveCart();
    showToast('Order copied to cart');
  }


  /* =========================================================
     TRACK RIDER MODAL
     ========================================================= */
  function showTrackModal(order) {
    document.getElementById('trackRiderName').innerHTML = `<strong>Rider:</strong> ${order.riderName || 'Not assigned'}`;
    document.getElementById('trackRiderPhone').innerHTML = `<strong>Phone:</strong> ${order.riderPhone || 'Not provided'}`;
    document.getElementById('trackOrderStatus').innerHTML = `<strong>Status:</strong> ${getStatusText(order.status)}`;
    document.getElementById('trackModal').classList.add('active');
  }
  window.closeTrackModal = () => document.getElementById('trackModal').classList.remove('active');


  /* =========================================================
     UTILITY
     ========================================================= */
  function escapeHtml(str) {
    return String(str).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m] || m));
  }


  /* =========================================================
     CART OPEN / CLOSE
     ========================================================= */
  const overlay = document.getElementById('cartOverlay');
  function openCart() { overlay.classList.add('open'); renderCartDrawer(); }
  function closeCart() { overlay.classList.remove('open'); }
  document.getElementById('cartIcon').addEventListener('click', openCart);
  document.getElementById('closeCartBtn').addEventListener('click', closeCart);
  document.getElementById('clearCartDrawerBtn').addEventListener('click', () => { cart = []; saveCart(); renderCartDrawer(); showToast('Cart cleared'); });

  document.getElementById('checkoutDrawerBtn').addEventListener('click', async () => {
    if (!cart.length) return alert('Cart empty');
    let name = '';
    while (true) {
      name = prompt('Enter your full name (letters only):');
      if (name === null) return;
      if (/^[A-Za-z\s\-']+$/.test(name) && name.trim().length > 0) break;
      alert('❌ Invalid name. Use only letters, spaces, hyphens, or apostrophes. No numbers.');
    }
    let phone = '';
    while (true) {
      phone = prompt('Enter your phone number (10 digits, e.g., 024XXXXXXX):');
      if (phone === null) return;
      if (/^0\d{9}$/.test(phone)) break;
      alert('❌ Invalid phone number. Must be exactly 10 digits starting with 0.');
    }
    let address = '';
    while (true) {
      address = prompt('Enter delivery address (street, city, landmark):');
      if (address === null) return;
      if (address.trim().length > 0) break;
      alert('❌ Address cannot be empty.');
    }
    await placeOrder(name, phone, address);
  });
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeCart(); });


  /* =========================================================
     POLLING & INIT
     ========================================================= */
  function startPolling() {
    if (pollInterval) clearInterval(pollInterval);
    pollInterval = setInterval(async () => { if (userId) await loadOrderHistory(); }, 15000);
  }
  loadMenu(); updateCartUI(); loadOrderHistory().then(() => startPolling());
  updateNotificationUI();
</script>
</body>
</html>
