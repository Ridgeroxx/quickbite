<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QuickBite | Ghanaian Eatery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --orange: #D4600A; --orange-mid: #E87820; --orange-light: #F49842;
      --orange-glow: rgba(212,96,10,0.18); --orange-pale: #FFF0E2; --peach: #FFD6B0;
      --cream: #FFF8F1; --cream-mid: #F5ECE2; --cream-dark: #EDE3D7; --white: #FFFFFF;
      --bark: #2C1810; --bark-mid: #5C4033; --bark-light: #8E6E55;
      --bark-muted: #AD9580; --bark-faint: #C8B8A8;
      --green: #1B7A3D; --green-bg: #E6F5EA;
      --blue: #1A65C0; --blue-bg: #E2F0FF;
      --red: #C62828; --red-bg: #FFEAEA;
      --purple: #7B2D8E; --purple-bg: #F3E5F6;
      --yellow-bg: #FFF8E1;
      --border: #EAE0D5; --border-light: #F2ECE5;
      --sh-xs: 0 1px 2px rgba(61,34,21,0.04);
      --sh-sm: 0 2px 8px rgba(61,34,21,0.06);
      --sh-md: 0 6px 20px rgba(61,34,21,0.08);
      --sh-lg: 0 12px 40px rgba(61,34,21,0.12);
      --sh-card: 0 2px 12px rgba(139,94,60,0.07);
      --r-sm: 10px; --r-md: 16px; --r-lg: 22px; --r-xl: 28px; --r-pill: 100px;
      --f-body: 'Outfit', system-ui, sans-serif;
      --f-display: 'Fraunces', Georgia, serif;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    body {
      font-family: var(--f-body); background: var(--cream); color: var(--bark);
      line-height: 1.6; -webkit-font-smoothing: antialiased;
      min-height: 100vh; overflow-x: hidden;
    }

    body::before {
      content: ''; position: fixed; inset: 0;
      background: radial-gradient(ellipse at 15% 0%, rgba(232,120,32,0.06) 0%, transparent 55%),
                  radial-gradient(ellipse at 85% 100%, rgba(139,94,60,0.04) 0%, transparent 50%);
      pointer-events: none; z-index: 0;
    }

    .container { position: relative; z-index: 1; max-width: 960px; margin: 0 auto; padding: 0 14px 110px; }

    /* HEADER */
    .header {
      position: sticky; top: 0; z-index: 20;
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(255,248,241,0.6);
      backdrop-filter: blur(22px) saturate(1.5); -webkit-backdrop-filter: blur(22px) saturate(1.5);
      border-radius: 0 0 var(--r-lg) var(--r-lg);
      padding: 10px 16px; margin-bottom: 22px;
      border-bottom: 1px solid rgba(234,224,213,0.5);
      transition: all 0.3s var(--ease);
    }
    .header.scrolled { background: rgba(255,248,241,0.92); box-shadow: 0 4px 24px rgba(44,24,16,0.06); }
    .logo h1 { font-family: var(--f-display); font-size: 1.35rem; font-weight: 700; color: var(--orange); letter-spacing: -0.02em; }
    .right-icons { display: flex; align-items: center; gap: 10px; }
    .greeting {
      font-size: 0.78rem; font-weight: 500; color: var(--bark-mid);
      background: var(--white); padding: 6px 14px; border-radius: var(--r-pill);
      box-shadow: var(--sh-xs); border: 1px solid var(--border-light);
      white-space: nowrap; max-width: 155px; overflow: hidden; text-overflow: ellipsis;
    }
    .notification-bell, .cart-icon {
      position: relative; cursor: pointer; background: var(--white);
      width: 42px; height: 42px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--sh-sm); border: 1px solid var(--border-light);
      font-size: 1.1rem; transition: transform 0.2s var(--ease-spring), box-shadow 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .notification-bell:active, .cart-icon:active { transform: scale(0.9); }
    .notification-badge {
      position: absolute; top: -3px; right: -3px;
      background: var(--red); color: var(--white);
      font-size: 9px; font-weight: 700; min-width: 18px; height: 18px;
      border-radius: var(--r-pill); display: flex; align-items: center; justify-content: center;
      padding: 0 5px; border: 2px solid var(--cream); animation: pop 0.3s var(--ease-spring);
    }
    .cart-count {
      position: absolute; top: -4px; right: -4px;
      background: var(--orange); color: var(--white);
      font-size: 10px; font-weight: 700; min-width: 20px; height: 20px;
      border-radius: var(--r-pill); display: flex; align-items: center; justify-content: center;
      padding: 0 5px; border: 2px solid var(--cream);
    }
    @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }

    /* NOTIFICATION PANEL */
    .notification-panel {
      position: fixed; top: 70px; right: 14px; width: 300px; max-height: 420px;
      background: var(--white); border-radius: var(--r-lg); box-shadow: var(--sh-lg);
      z-index: 2001; display: none; flex-direction: column; overflow: hidden;
      border: 1px solid var(--border); transform-origin: top right;
    }
    .notification-panel.open { display: flex; animation: panelIn 0.28s var(--ease); }
    @keyframes panelIn {
      from { opacity: 0; transform: scale(0.95) translateY(-6px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .notification-header {
      padding: 14px 18px;
      background: linear-gradient(135deg, var(--orange), var(--orange-mid));
      color: var(--white); font-weight: 600; font-size: 0.88rem;
    }
    .notification-list { max-height: 360px; overflow-y: auto; padding: 6px; font-size: 0.82rem; color: var(--bark-mid); }
    .notification-item {
      padding: 10px 12px; border-bottom: 1px solid var(--border-light);
      border-radius: var(--r-sm); margin-bottom: 2px; font-size: 0.8rem; line-height: 1.5;
    }
    .notification-item:last-child { border-bottom: none; }

    /* CATEGORIES */
    .categories { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 18px; padding: 4px 0; scrollbar-width: none; }
    .categories::-webkit-scrollbar { display: none; }
    .cat-btn {
      background: var(--white); padding: 9px 20px; border-radius: var(--r-pill);
      font-weight: 600; font-size: 0.82rem; white-space: nowrap; cursor: pointer;
      box-shadow: var(--sh-xs); border: 1.5px solid var(--border); color: var(--bark-mid);
      transition: all 0.22s var(--ease); -webkit-tap-highlight-color: transparent; text-transform: capitalize;
    }
    .cat-btn:hover { border-color: var(--orange-light); color: var(--orange); }
    .cat-btn.active {
      background: linear-gradient(135deg, var(--orange), var(--orange-mid));
      color: var(--white); border-color: transparent; box-shadow: 0 3px 14px rgba(212,96,10,0.25);
    }

    /* MENU GRID */
    .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    @media (min-width: 600px) { .menu-grid { grid-template-columns: repeat(3, 1fr); gap: 16px; } }
    @media (min-width: 900px) { .menu-grid { grid-template-columns: repeat(4, 1fr); gap: 18px; } }
    .loading { grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--bark-muted); font-size: 0.9rem; }

    /* ITEM CARD */
    .item-card {
      background: var(--white); border-radius: var(--r-xl); overflow: hidden;
      box-shadow: var(--sh-card); border: 1px solid var(--border-light);
      transition: transform 0.22s var(--ease), box-shadow 0.22s;
      animation: cardIn 0.4s var(--ease) both;
    }
    .item-card:hover { transform: translateY(-3px) scale(1.01); box-shadow: var(--sh-md); }
    .item-card:active { transform: translateY(-1px) scale(1.0); }
    @keyframes cardIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .item-card:nth-child(1) { animation-delay: 0.02s; } .item-card:nth-child(2) { animation-delay: 0.06s; }
    .item-card:nth-child(3) { animation-delay: 0.10s; } .item-card:nth-child(4) { animation-delay: 0.14s; }
    .item-card:nth-child(5) { animation-delay: 0.18s; } .item-card:nth-child(6) { animation-delay: 0.22s; }
    .item-card:nth-child(7) { animation-delay: 0.26s; } .item-card:nth-child(8) { animation-delay: 0.30s; }
    .item-img {
      background: linear-gradient(145deg, var(--orange-pale), #FFF5EA);
      text-align: center; font-size: 2.8rem; padding: 20px 0 16px; position: relative;
    }
    .item-img::after {
      content: ''; position: absolute; width: 52px; height: 52px; border-radius: 50%;
      background: rgba(255,255,255,0.55); top: 50%; left: 50%; transform: translate(-50%, -50%);
    }
    .item-details { padding: 12px 14px 14px; }
    .item-name { font-weight: 700; font-size: 0.86rem; color: var(--bark); line-height: 1.3; margin-bottom: 2px; }
    .item-price { font-family: var(--f-display); color: var(--orange); font-weight: 800; font-size: 0.95rem; margin-bottom: 6px; }
    .addons { margin: 6px 0; display: flex; flex-wrap: wrap; gap: 5px; font-size: 0.72rem; }
    .addon-check {
      background: var(--cream-mid); border-radius: var(--r-pill); padding: 4px 10px;
      display: inline-flex; align-items: center; gap: 4px; cursor: pointer; font-size: 0.68rem;
      color: var(--bark-mid); border: 1px solid transparent; transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .addon-check:has(input:checked) { background: var(--orange-pale); border-color: var(--orange-light); color: var(--orange); }
    .addon-check input[type="checkbox"] { width: 12px; height: 12px; accent-color: var(--orange); }
    .item-total { font-size: 0.72rem; font-weight: 600; margin: 6px 0; text-align: right; color: var(--bark-light); }
    .btn-add {
      background: linear-gradient(135deg, var(--orange), var(--orange-mid));
      color: var(--white); border: none; width: 100%; padding: 10px; border-radius: var(--r-pill);
      font-weight: 600; font-size: 0.82rem; cursor: pointer; margin-top: 6px;
      transition: transform 0.12s var(--ease-spring), box-shadow 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-add:hover { box-shadow: 0 4px 16px rgba(212,96,10,0.3); }
    .btn-add:active { transform: scale(0.95); }

    /* CART OVERLAY & DRAWER */
    .cart-overlay {
      position: fixed; inset: 0; background: rgba(44,24,16,0.45);
      backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
      z-index: 1000; visibility: hidden; opacity: 0; transition: all 0.3s var(--ease);
    }
    .cart-overlay.open { visibility: visible; opacity: 1; }
    .cart-drawer {
      position: fixed; top: 0; right: 0; bottom: 0; width: 88%; max-width: 380px;
      background: var(--white); display: flex; flex-direction: column;
      transform: translateX(100%); transition: transform 0.38s var(--ease);
      z-index: 1001; border-radius: var(--r-xl) 0 0 var(--r-xl);
      box-shadow: -8px 0 40px rgba(44,24,16,0.15);
    }
    .cart-overlay.open .cart-drawer { transform: translateX(0); }
    .cart-header {
      padding: 18px 20px 14px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
      font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; color: var(--bark);
    }
    .cart-header button {
      background: var(--cream-mid) !important; border: none !important;
      width: 34px; height: 34px; border-radius: 50%; font-size: 1rem !important;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      color: var(--bark-mid); transition: background 0.2s;
    }
    .cart-header button:hover { background: var(--border) !important; }
    .cart-items { flex: 1; overflow-y: auto; padding: 14px 18px; }
    .empty-cart { text-align: center; padding: 40px 20px; color: var(--bark-muted); font-size: 0.9rem; }
    .cart-item {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border-light);
    }
    .cart-item:last-child { border-bottom: none; margin-bottom: 0; }
    .cart-item-info { flex: 1; min-width: 0; }
    .cart-item-name { font-weight: 600; font-size: 0.86rem; color: var(--bark); line-height: 1.3; word-break: break-word; }
    .cart-item-addons { font-size: 0.72rem; color: var(--bark-muted); margin-top: 2px; }
    .cart-item-qty { display: flex; align-items: center; gap: 6px; margin: 0 10px; flex-shrink: 0; }
    .cart-item-qty button {
      background: var(--cream-mid); border: 1px solid var(--border);
      width: 30px; height: 30px; border-radius: 50%; font-weight: 700; font-size: 1rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      color: var(--bark-mid); transition: all 0.15s; -webkit-tap-highlight-color: transparent;
    }
    .cart-item-qty button:hover { background: var(--orange-pale); border-color: var(--orange-light); color: var(--orange); }
    .cart-item-qty button:active { transform: scale(0.88); }
    .cart-item-qty span { font-weight: 700; font-size: 0.9rem; min-width: 18px; text-align: center; }
    .cart-item-price { font-weight: 700; font-size: 0.86rem; min-width: 68px; text-align: right; color: var(--bark); flex-shrink: 0; }
    .cart-footer { padding: 14px 18px 18px; border-top: 1px solid var(--border); background: var(--cream); }
    .cart-total { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 14px; font-size: 0.88rem; color: var(--bark); }
    .cart-total span:last-child { text-align: right; font-size: 0.82rem; line-height: 1.5; }
    .cart-actions { display: flex; gap: 10px; }
    .btn-checkout, .btn-clear {
      flex: 1; padding: 13px; border-radius: var(--r-pill); border: none;
      font-weight: 600; font-size: 0.86rem; cursor: pointer;
      transition: all 0.2s var(--ease); -webkit-tap-highlight-color: transparent;
    }
    .btn-checkout {
      background: linear-gradient(135deg, var(--orange), var(--orange-mid)); color: var(--white);
      box-shadow: 0 4px 16px rgba(212,96,10,0.2);
    }
    .btn-checkout:hover { box-shadow: 0 6px 22px rgba(212,96,10,0.3); }
    .btn-checkout:active { transform: scale(0.97); }
    .btn-clear { background: var(--cream-dark); color: var(--bark-mid); border: 1px solid var(--border); }
    .btn-clear:hover { background: var(--border); }

    /* TOAST */
    .toast {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(10px);
      background: var(--bark); color: var(--white); font-size: 0.82rem; font-weight: 500;
      padding: 10px 22px; border-radius: var(--r-pill); z-index: 3000;
      opacity: 0; transition: opacity 0.25s, transform 0.25s var(--ease);
      box-shadow: var(--sh-lg); max-width: 90%; text-align: center; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ORDER HISTORY */
    .history-section {
      margin-top: 32px; background: var(--white); border-radius: var(--r-xl);
      padding: 20px 18px; box-shadow: var(--sh-card); border: 1px solid var(--border-light);
    }
    .history-title { font-family: var(--f-display); font-weight: 700; font-size: 1.1rem; margin-bottom: 14px; color: var(--bark); }
    .order-history-item {
      background: var(--cream); border-radius: var(--r-md); padding: 16px; margin-bottom: 12px;
      border: 1px solid var(--border-light); transition: box-shadow 0.2s; animation: cardIn 0.3s var(--ease) both;
    }
    .order-history-item:last-child { margin-bottom: 0; }
    .order-history-item:hover { box-shadow: var(--sh-sm); }
    .order-card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .order-card-id { font-family: var(--f-display); font-weight: 700; font-size: 1rem; color: var(--orange); }

    /* STATUS BADGES */
    .status-badge {
      display: inline-block; padding: 3px 10px; border-radius: var(--r-pill);
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase;
    }
    .status-pending_payment { background: var(--yellow-bg); color: #B8860B; }
    .status-paid { background: #FFF3E0; color: #E65100; }
    .status-confirmed { background: var(--blue-bg); color: var(--blue); }
    .status-processing { background: var(--purple-bg); color: var(--purple); }
    .status-completed { background: #E0F2F1; color: #00695C; }
    .status-assigned_to_rider { background: var(--orange-pale); color: var(--orange); }
    .status-delivered { background: var(--green-bg); color: var(--green); }
    .status-cancelled { background: var(--red-bg); color: var(--red); }

    .order-card-meta { font-size: 0.72rem; color: var(--bark-muted); margin-bottom: 4px; }
    .order-card-total { font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; color: var(--bark); margin-bottom: 4px; }
    .order-card-rider {
      font-size: 0.8rem; color: var(--orange); margin-bottom: 4px; padding: 6px 10px;
      background: var(--orange-pale); border-radius: var(--r-sm); display: inline-block;
    }
    .order-buttons {
      display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px;
      padding-top: 10px; border-top: 1px solid var(--border-light);
    }
    .btn-reorder, .btn-view-details, .btn-track {
      border: none; color: var(--white); padding: 7px 14px; border-radius: var(--r-pill);
      font-size: 0.72rem; font-weight: 700; cursor: pointer;
      transition: transform 0.12s, box-shadow 0.2s; -webkit-tap-highlight-color: transparent;
    }
    .btn-reorder { background: var(--orange); }
    .btn-view-details { background: var(--blue); }
    .btn-track { background: var(--green); }
    .btn-reorder:active, .btn-view-details:active, .btn-track:active { transform: scale(0.93); }

    /* MODALS — bottom sheet on mobile, centered dialog on desktop */
    .modal {
      position: fixed; inset: 0; background: rgba(44,24,16,0.5);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      z-index: 2000; display: none; align-items: flex-end; justify-content: center; padding: 0;
    }
    .modal.active { display: flex; animation: modalBgIn 0.3s var(--ease); }
    @keyframes modalBgIn { from { opacity: 0; } to { opacity: 1; } }

    .modal-content {
      background: var(--white); border-radius: var(--r-xl) var(--r-xl) 0 0;
      padding: 24px 20px 32px; width: 100%; max-width: 500px; max-height: 88vh;
      overflow-y: auto; box-shadow: 0 -8px 40px rgba(44,24,16,0.15);
      animation: sheetUp 0.38s var(--ease); line-height: 1.7; font-size: 0.88rem;
      -webkit-overflow-scrolling: touch;
    }
    @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    /* Drag handle */
    .modal-content::before {
      content: ''; display: block; width: 36px; height: 4px;
      background: var(--border); border-radius: 4px; margin: 0 auto 16px;
    }

    @media (min-width: 600px) {
      .modal { align-items: center; padding: 20px; }
      .modal-content {
        border-radius: var(--r-xl); max-height: 85vh; box-shadow: var(--sh-lg);
        animation: dialogIn 0.32s var(--ease);
      }
      .modal-content::before { display: none; }
      @keyframes dialogIn {
        from { transform: translateY(20px) scale(0.97); opacity: 0; }
        to { transform: translateY(0) scale(1); opacity: 1; }
      }
    }

    .modal-content h3 { font-family: var(--f-display); font-size: 1.2rem; margin-bottom: 10px; color: var(--bark); }
    .modal-content p { margin-bottom: 5px; color: var(--bark-mid); }
    .modal-content strong { color: var(--bark); }
    .modal-content hr { border: none; border-top: 1px solid var(--border-light); margin: 14px 0; }
    .modal-content ul { padding-left: 18px; margin: 8px 0; }
    .modal-content li { margin-bottom: 4px; font-size: 0.83rem; }
    .modal-close {
      float: right; background: var(--cream-mid); border: none;
      width: 34px; height: 34px; border-radius: 50%; font-size: 1.1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center; color: var(--bark-mid);
      transition: background 0.2s; line-height: 1;
    }
    .modal-close:hover { background: var(--border); }

    .payment-field { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--border); }
    .payment-field p { font-size: 0.85rem; margin-bottom: 8px; }
    .payment-field input {
      width: 100%; padding: 12px 16px; border: 2px solid var(--border); border-radius: var(--r-md);
      margin: 8px 0; font-size: 0.88rem; outline: none; transition: border-color 0.2s;
      font-family: var(--f-body); background: var(--cream);
    }
    .payment-field input:focus { border-color: var(--orange); background: var(--white); }
    .payment-field button {
      background: linear-gradient(135deg, var(--orange), var(--orange-mid));
      color: var(--white); border: none; padding: 13px; border-radius: var(--r-pill);
      width: 100%; font-weight: 700; font-size: 0.88rem; cursor: pointer;
      transition: transform 0.12s, box-shadow 0.2s; margin-top: 4px;
    }
    .payment-field button:hover { box-shadow: 0 4px 18px rgba(212,96,10,0.25); }
    .payment-field button:active { transform: scale(0.97); }
    .payment-field button:disabled { opacity: 0.5; cursor: not-allowed; }

    .rider-info-card {
      background: var(--orange-pale); border-radius: var(--r-md); padding: 12px 16px; margin-top: 10px;
    }
    .rider-info-card p { color: var(--bark) !important; margin-bottom: 2px !important; font-size: 0.88rem; }

    .item-img img {
      width: 100%; height: 110px; object-fit: cover; display: block;
      position: relative; z-index: 1;
    }
    .item-vendor {
      font-size: 0.7rem; font-weight: 600; color: var(--orange);
      display: flex; align-items: center; gap: 4px; margin-bottom: 2px;
    }
    .item-vendor i { font-size: 0.6rem; }
    .item-hours {
      font-size: 0.65rem; color: var(--bark-muted);
      display: flex; align-items: center; gap: 4px; margin-bottom: 4px;
    }
    .item-hours i { font-size: 0.58rem; color: var(--bark-faint); }
    .special-instructions {
      width: 100%; padding: 8px 10px; border: 1.5px solid var(--border);
      border-radius: var(--r-sm); font-family: var(--f-body); font-size: 0.72rem;
      color: var(--bark-mid); background: var(--cream); resize: none;
      outline: none; transition: border-color 0.2s; min-height: 38px;
      margin: 6px 0;
    }
    .special-instructions:focus { border-color: var(--orange); background: var(--white); }
    .special-instructions::placeholder { color: var(--bark-faint); }
    .cart-item-note {
      font-size: 0.68rem; color: var(--bark-muted); font-style: italic;
      margin-top: 2px; line-height: 1.3;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

    @media (max-width: 400px) {
      .greeting { display: none; }
      .header { padding: 10px 12px; }
      .logo h1 { font-size: 1.2rem; }
      .menu-grid { gap: 10px; }
      .item-img { font-size: 2.3rem; padding: 16px 0 12px; }
      .item-details { padding: 10px 12px 12px; }
      .item-name { font-size: 0.8rem; }
      .btn-add { padding: 9px; font-size: 0.76rem; }
      .order-history-item { padding: 14px 12px; }
    }
    @media (min-width: 768px) {
      .container { padding: 0 24px 110px; }
      .header { border-radius: var(--r-lg); margin-top: 10px; }
      .history-section { padding: 24px 28px; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header" id="pageHeader">
    <div class="logo"><h1>🍛 QuickBite <span style="font-size:0.7rem;">🇬🇭</span></h1></div>
    <div class="right-icons">
      <div class="greeting" id="greeting">Loading...</div>
      <div class="notification-bell" id="notificationBell">🔔
        <span class="notification-badge" id="notificationBadge" style="display: none;">0</span>
      </div>
      <div class="cart-icon" id="cartIcon">🛒<span class="cart-count" id="cartCount">0</span></div>
    </div>
  </div>
  <div id="notificationPanel" class="notification-panel">
    <div class="notification-header">Notifications</div>
    <div id="notificationList" class="notification-list">No new notifications</div>
  </div>
  <div id="categories" class="categories"></div>
  <div id="menuGrid" class="menu-grid"><div class="loading">Loading menu...</div></div>
  <div class="history-section">
    <div class="history-title">🕒 Your Recent Orders</div>
    <div id="orderHistoryList">Loading...</div>
  </div>
</div>

<div id="cartOverlay" class="cart-overlay">
  <div class="cart-drawer">
    <div class="cart-header"><span>🛒 Your Cart</span><button id="closeCartBtn" style="background:none; border:none; font-size:1.2rem; cursor:pointer;">✕</button></div>
    <div id="cartDrawerItems" class="cart-items">Empty</div>
    <div class="cart-footer">
      <div class="cart-total"><span>Total</span><span id="cartDrawerTotal">GHS 0.00</span></div>
      <div class="cart-actions">
        <button id="clearCartDrawerBtn" class="btn-clear">Clear</button>
        <button id="checkoutDrawerBtn" class="btn-checkout">Checkout →</button>
      </div>
    </div>
  </div>
</div>

<div id="orderDetailsModal" class="modal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeOrderDetailsModal()">&times;</button>
    <div id="orderDetailsContent"></div>
  </div>
</div>
<div id="trackModal" class="modal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeTrackModal()">&times;</button>
    <h3>🚴 Rider Status</h3>
    <p id="trackRiderName"></p>
    <p id="trackRiderPhone"></p>
    <p id="trackOrderStatus"></p>
  </div>
</div>

<script>
  // ── Telegram WebApp init ──
  let tg = null, user = null;
  try {
    if (window.Telegram && window.Telegram.WebApp) {
      tg = window.Telegram.WebApp;
      tg.expand();
      user = tg.initDataUnsafe?.user || null;
      if (!user && tg.initData) {
        try {
          const p = new URLSearchParams(tg.initData);
          const u = p.get('user');
          if (u) user = JSON.parse(decodeURIComponent(u));
        } catch(e) {}
      }
      if (!user) {
        try {
          const h = window.location.hash.substring(1);
          if (h) { const hp = new URLSearchParams(h); const u = hp.get('user'); if (u) user = JSON.parse(decodeURIComponent(u)); }
        } catch(e) {}
      }
    }
  } catch(e) { console.log('Telegram WebApp not available'); }

  let userId = user?.id ? String(user.id) : localStorage.getItem('userId');
  if (!userId) { userId = 'user_' + Math.random().toString(36).substr(2, 10); }
  localStorage.setItem('userId', userId);

  let userName = '';
  if (user?.first_name && user.first_name.trim()) {
    userName = user.first_name.trim();
    localStorage.setItem('userName', userName);
  } else {
    userName = localStorage.getItem('userName') || '';
  }
  if (!userName) {
    const prompted = prompt('Welcome to QuickBite! 🍛\nWhat should we call you?');
    userName = (prompted && prompted.trim()) ? prompted.trim() : 'Customer';
    localStorage.setItem('userName', userName);
  }
  document.getElementById('greeting').innerText = '👋 Hello, ' + userName;

  const API_BASE = 'https://quickbite-joi1.onrender.com';
  let menu = [], cart = JSON.parse(localStorage.getItem('cart') || '[]'), activeCategory = 'all';
  let isCheckingOut = false, lastOrdersState = [], pollInterval = null;
  let notifications = JSON.parse(localStorage.getItem('notifications') || '[]');
  let unreadCount = notifications.filter(n => !n.read).length;

  /* ── Category display labels (data-cat values stay unchanged) ── */
  const categoryLabels = {
    'all':           '🍽️ All',
    'Rice Dishes':   '🍚 Rice (Times, Hajia)',
    'Local Dishes':  '🍛 Waakye, Banku, Kenkey',
    'Noodles':       '🍜 Indomie / Spaghetti',
    'Drinks':        '🥤 Juices & Beverages',
    'Snacks':        '🍿 Snacks & Sides',
    'Soups':         '🥘 Soups & Stews',
    'Grills':        '🔥 Grills & BBQ',
    'Breakfast':     '🥞 Breakfast',
    'Desserts':      '🍰 Desserts'
  };

  /* ── Demo vendor/hours/image data (keyed by item name) ── */
  const vendorInfo = {
    'Jollof Rice':       { vendor: 'Auntie Ama Kitchen', hours: '8am – 9pm',  imageUrl: 'https://images.unsplash.com/photo-1587116861219-230ac19df971?w=300&h=200&fit=crop' },
    'Fried Rice':        { vendor: 'Times Restaurant',   hours: '10am – 10pm', imageUrl: 'https://images.unsplash.com/photo-1603133872878-684f208fb84b?w=300&h=200&fit=crop' },
    'Plain Rice':        { vendor: 'Times Restaurant',   hours: '10am – 10pm', imageUrl: 'https://images.unsplash.com/photo-1516684732162-798a0062be99?w=300&h=200&fit=crop' },
    'Waakye':            { vendor: 'Hajia Waakye Joint', hours: '6am – 2pm',   imageUrl: 'https://images.unsplash.com/photo-1604329760661-e71dc83f8f26?w=300&h=200&fit=crop' },
    'Banku':             { vendor: 'Auntie Ama Kitchen', hours: '8am – 9pm',   imageUrl: 'https://images.unsplash.com/photo-1567982047351-76b6f93e38ee?w=300&h=200&fit=crop' },
    'Kenkey':            { vendor: 'Ga Kenkey Spot',     hours: '7am – 6pm',   imageUrl: 'https://images.unsplash.com/photo-1512058564366-18510be2db19?w=300&h=200&fit=crop' },
    'Fufu':              { vendor: 'Auntie Ama Kitchen', hours: '10am – 9pm',  imageUrl: 'https://images.unsplash.com/photo-1574484284002-952d92456975?w=300&h=200&fit=crop' },
    'Indomie':           { vendor: 'Quick Noodle Bar',   hours: '24 Hours',    imageUrl: 'https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=300&h=200&fit=crop' },
    'Spaghetti':         { vendor: 'Quick Noodle Bar',   hours: '10am – 10pm', imageUrl: 'https://images.unsplash.com/photo-1551183053-bf91a1d81141?w=300&h=200&fit=crop' },
    'Sobolo':            { vendor: 'Fresh Juice Corner',  hours: '8am – 7pm',  imageUrl: 'https://images.unsplash.com/photo-1534353473418-4cfa6c56fd38?w=300&h=200&fit=crop' },
    'Fresh Juice':       { vendor: 'Fresh Juice Corner',  hours: '8am – 7pm',  imageUrl: 'https://images.unsplash.com/photo-1622597467836-f3285f2131b8?w=300&h=200&fit=crop' },
    'Malt':              { vendor: 'Fresh Juice Corner',  hours: '8am – 10pm', imageUrl: 'https://images.unsplash.com/photo-1581006852262-e4307cf6283a?w=300&h=200&fit=crop' },
    'Water':             { vendor: 'Fresh Juice Corner',  hours: '24 Hours',   imageUrl: 'https://images.unsplash.com/photo-1548839140-29a749e1cf4d?w=300&h=200&fit=crop' },
    'Soft Drink':        { vendor: 'Fresh Juice Corner',  hours: '8am – 10pm', imageUrl: 'https://images.unsplash.com/photo-1527960471264-932f39eb5846?w=300&h=200&fit=crop' }
  };

  /* FIX: 'paid' = ref submitted, NOT admin-confirmed */
  function getStatusText(status) {
    const map = {
      'pending_payment': 'Awaiting Payment',
      'paid': 'Awaiting Confirmation',
      'confirmed': 'Order Confirmed',
      'processing': 'Preparing',
      'completed': 'Ready for Delivery',
      'assigned_to_rider': 'Rider Assigned 🚴',
      'delivered': 'Delivered 🎉'
    };
    return map[status] || status.replace(/_/g, ' ');
  }

  function getStatusClass(status) { return 'status-' + (status || '').replace(/\s/g, '_'); }

  function playBeep() {
    try {
      const a = new (window.AudioContext || window.webkitAudioContext)();
      const o = a.createOscillator(); const g = a.createGain();
      o.connect(g); g.connect(a.destination);
      o.frequency.value = 800; g.gain.value = 0.2; o.start();
      g.gain.exponentialRampToValueAtTime(0.00001, a.currentTime + 0.5);
      o.stop(a.currentTime + 0.5);
    } catch(e) {}
  }

  function addNotification(message) {
    const n = { id: Date.now(), message, timestamp: new Date().toLocaleTimeString(), read: false };
    notifications.unshift(n);
    if (notifications.length > 50) notifications.pop();
    localStorage.setItem('notifications', JSON.stringify(notifications));
    unreadCount = notifications.filter(n => !n.read).length;
    updateNotificationUI(); playBeep(); showToast(message);
  }

  function updateNotificationUI() {
    const badge = document.getElementById('notificationBadge');
    if (unreadCount > 0) { badge.style.display = 'flex'; badge.innerText = unreadCount > 9 ? '9+' : unreadCount; }
    else { badge.style.display = 'none'; }
    const listDiv = document.getElementById('notificationList');
    if (notifications.length === 0) { listDiv.innerHTML = 'No notifications'; }
    else {
      listDiv.innerHTML = notifications.map(n =>
        '<div class="notification-item" data-id="' + n.id + '" style="opacity:' + (n.read ? 0.6 : 1) + '; background:' + (n.read ? '#f9f9f9' : '#fff3e0') + ';">' +
        '<div>' + n.message + '</div>' +
        '<div style="font-size:10px; color:#888;">' + n.timestamp + '</div></div>'
      ).join('');
    }
  }

  function markAllAsRead() {
    notifications.forEach(n => n.read = true); unreadCount = 0;
    localStorage.setItem('notifications', JSON.stringify(notifications));
    updateNotificationUI();
  }

  const bell = document.getElementById('notificationBell');
  const panel = document.getElementById('notificationPanel');
  bell.addEventListener('click', (e) => {
    e.stopPropagation();
    if (panel.classList.contains('open')) { panel.classList.remove('open'); }
    else { markAllAsRead(); updateNotificationUI(); panel.classList.add('open'); }
  });
  document.addEventListener('click', (e) => {
    if (!panel.contains(e.target) && e.target !== bell) panel.classList.remove('open');
  });

  function showToast(msg) {
    let toast = document.querySelector('.toast');
    if (!toast) { toast = document.createElement('div'); toast.className = 'toast'; document.body.appendChild(toast); }
    toast.innerText = msg; toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  const header = document.getElementById('pageHeader');
  window.addEventListener('scroll', () => header.classList.toggle('scrolled', window.scrollY > 20));

  function saveCart() { localStorage.setItem('cart', JSON.stringify(cart)); updateCartUI(); renderCartDrawer(); }
  function updateCartUI() { document.getElementById('cartCount').innerText = cart.reduce((s,i) => s + i.qty, 0); }

  async function loadMenu() {
    try {
      const res = await fetch(API_BASE + '/api/menu');
      if (!res.ok) throw new Error();
      menu = await res.json();
      renderCategories(); renderMenu();
    } catch(err) { document.getElementById('menuGrid').innerHTML = '<div style="text-align:center;padding:40px;">⚠️ Could not load menu</div>'; }
  }

  function renderCategories() {
    const cats = ['all', ...new Set(menu.map(i => i.category))];
    const container = document.getElementById('categories');
    container.innerHTML = cats.map(c => {
      const label = categoryLabels[c] || (c === 'all' ? '🍽️ All' : c);
      return '<div class="cat-btn ' + (c === activeCategory ? 'active' : '') + '" data-cat="' + c + '">' + label + '</div>';
    }).join('');
    document.querySelectorAll('.cat-btn').forEach(btn => btn.addEventListener('click', () => {
      activeCategory = btn.dataset.cat; renderCategories(); renderMenu();
    }));
  }

  function renderMenu() {
    let filtered = activeCategory === 'all' ? menu : menu.filter(i => i.category === activeCategory);
    const grid = document.getElementById('menuGrid');
    grid.innerHTML = filtered.map(item => {
      const info = vendorInfo[item.name] || {};
      const vendor = item.vendor || info.vendor || '';
      const hours = item.hours || info.hours || '';
      const imageUrl = item.imageUrl || info.imageUrl || '';
      const imgContent = imageUrl
        ? '<img src="' + imageUrl + '" alt="' + escapeHtml(item.name) + '" style="width:100%;height:110px;object-fit:cover;" onerror="this.style.display=\'none\';this.parentNode.textContent=\'' + (item.emoji || '🍽️') + '\'">'
        : (item.emoji || '🍽️');
      return '<div class="item-card">' +
        '<div class="item-img">' + imgContent + '</div>' +
        '<div class="item-details">' +
          '<div class="item-name">' + escapeHtml(item.name) + '</div>' +
          (vendor ? '<div class="item-vendor"><i class="fa-solid fa-store"></i> ' + escapeHtml(vendor) + '</div>' : '') +
          (hours ? '<div class="item-hours"><i class="fa-regular fa-clock"></i> ' + escapeHtml(hours) + '</div>' : '') +
          '<div class="item-price">GHS ' + item.basePrice + '</div>' +
          '<textarea class="special-instructions" id="instructions-' + item.id + '" placeholder="Special requests (e.g. no onions, extra pepper)" rows="2"></textarea>' +
          '<button class="btn-add" data-id="' + item.id + '">Add to Cart</button>' +
        '</div>' +
      '</div>';
    }).join('');
    menu.forEach(item => {
      const btn = document.querySelector('.btn-add[data-id="' + item.id + '"]');
      if (btn) btn.addEventListener('click', () => addToCart(item.id));
    });
  }

  function updateItemTotal(itemId) {
    // No longer needed with special instructions (no addon prices)
  }

  function addToCart(itemId) {
    const item = menu.find(i => i.id === itemId);
    if (!item) return;
    const instrEl = document.getElementById('instructions-' + itemId);
    const specialInstructions = instrEl ? instrEl.value.trim() : '';
    const cartItem = {
      id: item.id, name: item.name, basePrice: item.basePrice,
      addons: [], totalPrice: item.basePrice, qty: 1,
      specialInstructions: specialInstructions
    };
    // Match by id AND instructions (different instructions = different cart line)
    const existing = cart.find(c => c.id === itemId && c.specialInstructions === specialInstructions);
    if (existing) existing.qty++;
    else cart.push(cartItem);
    saveCart();
    // Clear the textarea after adding
    if (instrEl) instrEl.value = '';
    showToast('➕ ' + item.name + ' added');
  }

  function renderCartDrawer() {
    const container = document.getElementById('cartDrawerItems');
    const totalSpan = document.getElementById('cartDrawerTotal');
    if (!cart.length) {
      container.innerHTML = '<div class="empty-cart">Your cart is empty</div>';
      totalSpan.innerHTML = 'GHS 0.00';
      return;
    }
    let html = '', subtotal = 0;
    cart.forEach((item, idx) => {
      const lineTotal = item.totalPrice * item.qty;
      subtotal += lineTotal;
      const noteHtml = item.specialInstructions ? '<div class="cart-item-note">📝 ' + escapeHtml(item.specialInstructions) + '</div>' : '';
      html += '<div class="cart-item" data-idx="' + idx + '">' +
        '<div class="cart-item-info"><div class="cart-item-name">' + escapeHtml(item.name) + '</div>' + noteHtml + '<div class="cart-item-addons">GHS ' + item.totalPrice + ' each</div></div>' +
        '<div class="cart-item-qty"><button onclick="changeQty(' + idx + ', -1)">-</button><span>' + item.qty + '</span><button onclick="changeQty(' + idx + ', 1)">+</button></div>' +
        '<div class="cart-item-price">GHS ' + lineTotal.toFixed(2) + '</div></div>';
    });
    const total = subtotal + 5.00;
    container.innerHTML = html;
    totalSpan.innerHTML = 'Subtotal: GHS ' + subtotal.toFixed(2) + '<br>+ Delivery: GHS 5.00<br><strong>Total: GHS ' + total.toFixed(2) + '</strong>';
  }

  window.changeQty = (idx, delta) => {
    const newQty = cart[idx].qty + delta;
    if (newQty <= 0) cart.splice(idx, 1);
    else cart[idx].qty = newQty;
    saveCart();
  };

  /* FIX: Removed dummy rider contact from order alert */
  async function placeOrder(customerName, customerPhone, address) {
    if (isCheckingOut) return;
    isCheckingOut = true;
    const btn = document.getElementById('checkoutDrawerBtn');
    btn.disabled = true; btn.innerText = 'Placing order...';
    const items = cart.map(i => ({ id: i.id, name: i.name, basePrice: i.basePrice, addons: i.addons || [], qty: i.qty, specialInstructions: i.specialInstructions || '' }));
    try {
      const res = await fetch(API_BASE + '/api/orders', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId, items, address, customerName, customerPhone })
      });
      const data = await res.json();
      if (res.ok) {
        cart = []; saveCart(); closeCart();
        showToast('✅ Order #' + data.orderId + ' placed!');
        alert('✅ Order #' + data.orderId + '\nTotal: GHS ' + data.total + '\n\n💰 Send payment to: ' + data.momoNumber + '\nAfter payment, open your order details and enter the transaction reference.\n\nA rider will be assigned once your payment is confirmed.');
        await loadOrderHistory();
      } else {
        alert('Order failed: ' + (data.error || 'Unknown error'));
      }
    } catch (err) { console.error(err); alert('Network error. Please try again.'); }
    finally { isCheckingOut = false; btn.disabled = false; btn.innerText = 'Checkout →'; }
  }

  /* FIX: Blur input before closing to prevent viewport sticking */
  async function submitPaymentReference(orderId, reference) {
    const btn = document.querySelector('#orderDetailsModal .payment-field button');
    if (btn) { btn.disabled = true; btn.innerText = 'Submitting...'; }
    try {
      const res = await fetch(API_BASE + '/api/orders/' + orderId + '/payment-reference', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ reference })
      });
      const data = await res.json();
      if (res.ok) {
        showToast('✅ Reference submitted! Awaiting admin confirmation.');
        const refInput = document.getElementById('paymentRef');
        if (refInput) refInput.blur();
        await loadOrderHistory();
        setTimeout(() => { closeOrderDetailsModal(); window.scrollTo(0, window.scrollY); }, 800);
      } else { alert('Error: ' + data.error); }
    } catch (err) { alert('Network error. Please try again.'); }
    finally { if (btn) { btn.disabled = false; btn.innerText = 'Submit Reference'; } }
  }

  /* FIX: Rider only shown when status is assigned_to_rider or delivered */
  const RIDER_STATUSES = ['assigned_to_rider', 'delivered'];

  async function loadOrderHistory() {
    try {
      const res = await fetch(API_BASE + '/api/orders/' + userId);
      const orders = await res.json();
      const container = document.getElementById('orderHistoryList');
      if (!orders.length) { container.innerHTML = '<div style="text-align:center;padding:20px;color:var(--bark-muted);font-size:0.88rem;">No orders yet. Browse the menu above!</div>'; return; }
      if (lastOrdersState.length > 0) {
        orders.forEach(newOrder => {
          const oldOrder = lastOrdersState.find(o => o.id === newOrder.id);
          if (oldOrder && oldOrder.status !== newOrder.status) {
            let statusMsg = '';
            switch (newOrder.status) {
              case 'paid': statusMsg = 'Order #' + newOrder.id + ' reference received. Awaiting admin confirmation.'; break;
              case 'confirmed': statusMsg = 'Order #' + newOrder.id + ' payment confirmed! We are preparing your meal.'; break;
              case 'processing': statusMsg = 'Order #' + newOrder.id + ' is now being prepared.'; break;
              case 'completed': statusMsg = 'Order #' + newOrder.id + ' is ready for delivery.'; break;
              case 'assigned_to_rider': statusMsg = 'Order #' + newOrder.id + ' has been assigned to a rider! 🚴'; break;
              case 'delivered': statusMsg = '🎉 Order #' + newOrder.id + ' delivered! Enjoy your meal.'; break;
              default: statusMsg = 'Order #' + newOrder.id + ' status updated to ' + newOrder.status + '.';
            }
            addNotification(statusMsg);
          }
        });
      }
      lastOrdersState = JSON.parse(JSON.stringify(orders));
      container.innerHTML = orders.map(order => {
        const hasRider = order.riderName && RIDER_STATUSES.includes(order.status);
        return '<div class="order-history-item">' +
          '<div class="order-card-top"><span class="order-card-id">#' + order.id + '</span><span class="status-badge ' + getStatusClass(order.status) + '">' + getStatusText(order.status) + '</span></div>' +
          '<div class="order-card-meta">' + new Date(order.createdAt).toLocaleString() + '</div>' +
          '<div class="order-card-total">GHS ' + order.total + '</div>' +
          (hasRider ? '<div class="order-card-rider">🚴 ' + escapeHtml(order.riderName) + ' · ' + (order.riderPhone || 'No phone') + '</div>' : '') +
          '<div class="order-buttons">' +
            '<button class="btn-view-details" data-order=\'' + JSON.stringify(order) + '\'>📋 Details</button>' +
            '<button class="btn-reorder" data-order=\'' + JSON.stringify(order) + '\'>🔄 Reorder</button>' +
            (hasRider ? '<button class="btn-track" data-order=\'' + JSON.stringify(order) + '\'>📍 Track</button>' : '') +
          '</div></div>';
      }).join('');
      attachOrderButtons();
    } catch(err) { console.error(err); }
  }

  function attachOrderButtons() {
    document.querySelectorAll('.btn-view-details').forEach(btn => {
      btn.addEventListener('click', (e) => { e.stopPropagation(); showOrderDetails(JSON.parse(btn.dataset.order)); });
    });
    document.querySelectorAll('.btn-reorder').forEach(btn => {
      btn.addEventListener('click', (e) => { e.stopPropagation(); reorder(JSON.parse(btn.dataset.order)); });
    });
    document.querySelectorAll('.btn-track').forEach(btn => {
      btn.addEventListener('click', (e) => { e.stopPropagation(); showTrackModal(JSON.parse(btn.dataset.order)); });
    });
  }

  /* FIX: Rider section only when admin has assigned one */
  function showOrderDetails(order) {
    const itemsHtml = order.items.map(item => {
      const noteText = item.specialInstructions ? '<br><em style="color:var(--bark-muted);font-size:0.78rem;">📝 ' + escapeHtml(item.specialInstructions) + '</em>' : '';
      return '<li><strong>' + escapeHtml(item.name) + '</strong> x' + item.qty + ' = GHS ' + (item.totalPrice * item.qty) + noteText + '</li>';
    }).join('');

    let paymentSection = '';
    if (order.status === 'pending_payment') {
      const momoNumber = order.momoNumber || '+233206802552';
      paymentSection = '<div class="payment-field">' +
        '<p><strong>💰 Payment Instructions:</strong></p>' +
        '<p>Send <strong>GHS ' + order.total + '</strong> to: <strong>' + momoNumber + '</strong></p>' +
        '<p>Then enter your transaction reference below:</p>' +
        '<input type="text" id="paymentRef" placeholder="e.g., MOMO123456" autocomplete="off" />' +
        '<button id="submitPaymentBtn">Submit Reference</button></div>';
    }

    const hasRider = order.riderName && RIDER_STATUSES.includes(order.status);
    let riderSection = '';
    if (hasRider) {
      riderSection = '<hr><div class="rider-info-card"><p><strong>🚴 Rider:</strong> ' + escapeHtml(order.riderName) + '</p><p><strong>📞 Phone:</strong> ' + (order.riderPhone || 'Not provided') + '</p></div>';
    } else if (order.status === 'pending_payment' || order.status === 'paid') {
      riderSection = '<p style="color:var(--bark-muted);font-style:italic;margin-top:8px;">🚴 A rider will be assigned after payment is confirmed.</p>';
    } else {
      riderSection = '<p style="color:var(--bark-muted);font-style:italic;margin-top:8px;">🚴 Rider not yet assigned.</p>';
    }

    document.getElementById('orderDetailsContent').innerHTML =
      '<h3>Order #' + order.id + '</h3>' +
      '<p><strong>Status:</strong> <span class="status-badge ' + getStatusClass(order.status) + '" style="vertical-align:middle;">' + getStatusText(order.status) + '</span></p>' +
      '<p><strong>Date:</strong> ' + new Date(order.createdAt).toLocaleString() + '</p>' +
      '<p><strong>Customer:</strong> ' + escapeHtml(order.customerName) + '</p>' +
      '<p><strong>Phone:</strong> ' + escapeHtml(order.customerPhone) + '</p>' +
      '<p><strong>Address:</strong> ' + escapeHtml(order.address) + '</p>' +
      '<p><strong>Payment Ref:</strong> ' + (order.paymentReference || 'Not submitted') + '</p>' +
      '<hr><p><strong>Subtotal:</strong> GHS ' + order.subtotal + '</p>' +
      '<p><strong>Delivery:</strong> GHS ' + order.deliveryFee + '</p>' +
      '<p style="font-size:1.05rem;"><strong>Total: GHS ' + order.total + '</strong></p>' +
      '<hr><p><strong>Items:</strong></p><ul class="items-list">' + itemsHtml + '</ul>' +
      riderSection + paymentSection;

    document.getElementById('orderDetailsModal').classList.add('active');
    const payBtn = document.getElementById('submitPaymentBtn');
    if (payBtn) {
      payBtn.onclick = () => {
        const ref = document.getElementById('paymentRef').value.trim();
        if (!ref) { alert('Please enter a reference'); return; }
        submitPaymentReference(order.id, ref);
      };
    }
  }

  /* FIX: Blur + viewport reset on close */
  window.closeOrderDetailsModal = () => {
    if (document.activeElement) document.activeElement.blur();
    document.getElementById('orderDetailsModal').classList.remove('active');
    setTimeout(() => window.scrollTo(0, window.scrollY), 50);
  };

  function reorder(order) {
    const newCart = order.items.map(item => ({
      id: item.id, name: item.name, basePrice: item.basePrice,
      addons: [], totalPrice: item.totalPrice || item.basePrice, qty: item.qty || 1,
      specialInstructions: item.specialInstructions || ''
    }));
    cart = newCart; saveCart();
    showToast('Order copied to cart');
  }

  function showTrackModal(order) {
    document.getElementById('trackRiderName').innerHTML = '<strong>Rider:</strong> ' + (order.riderName || 'Not assigned');
    document.getElementById('trackRiderPhone').innerHTML = '<strong>Phone:</strong> ' + (order.riderPhone || 'Not provided');
    document.getElementById('trackOrderStatus').innerHTML = '<strong>Status:</strong> ' + getStatusText(order.status);
    document.getElementById('trackModal').classList.add('active');
  }
  window.closeTrackModal = () => {
    if (document.activeElement) document.activeElement.blur();
    document.getElementById('trackModal').classList.remove('active');
  };

  function escapeHtml(str) {
    return String(str).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m] || m));
  }

  const overlay = document.getElementById('cartOverlay');
  function openCart() { overlay.classList.add('open'); renderCartDrawer(); }
  function closeCart() { overlay.classList.remove('open'); }
  document.getElementById('cartIcon').addEventListener('click', openCart);
  document.getElementById('closeCartBtn').addEventListener('click', closeCart);
  document.getElementById('clearCartDrawerBtn').addEventListener('click', () => { cart = []; saveCart(); renderCartDrawer(); showToast('Cart cleared'); });

  document.getElementById('checkoutDrawerBtn').addEventListener('click', async () => {
    if (!cart.length) return alert('Cart empty');
    let name = '';
    while (true) {
      name = prompt('Enter your full name (letters only):');
      if (name === null) return;
      if (/^[A-Za-z\s\-']+$/.test(name) && name.trim().length > 0) break;
      alert('❌ Invalid name. Use only letters, spaces, hyphens, or apostrophes.');
    }
    let phone = '';
    while (true) {
      phone = prompt('Enter your phone number (10 digits, e.g., 024XXXXXXX):');
      if (phone === null) return;
      if (/^0\d{9}$/.test(phone)) break;
      alert('❌ Invalid phone number. Must be 10 digits starting with 0.');
    }
    let address = '';
    while (true) {
      address = prompt('Enter delivery address (street, city, landmark):');
      if (address === null) return;
      if (address.trim().length > 0) break;
      alert('❌ Address cannot be empty.');
    }
    await placeOrder(name, phone, address);
  });
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeCart(); });

  function startPolling() {
    if (pollInterval) clearInterval(pollInterval);
    pollInterval = setInterval(async () => { if (userId) await loadOrderHistory(); }, 15000);
  }
  loadMenu(); updateCartUI(); loadOrderHistory().then(() => startPolling());
  updateNotificationUI();
</script>
</body>
</html>
